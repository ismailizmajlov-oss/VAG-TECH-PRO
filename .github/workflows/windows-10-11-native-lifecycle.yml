name: VAG TECH PRO native Windows 10/11 x64 lifecycle validation

# Owner-controlled gate:
# Attach an isolated Windows 10/11 x64 self-hosted runner with labels
# self-hosted, windows, x64, vag-tech-pro-win10-11 and set the repository
# variable VAG_TECH_PRO_WIN10_11_RUNNER_AVAILABLE=true.
# No runner is registered or provisioned by this workflow.

on:
  workflow_run:
    workflows:
      - VAG TECH PRO Windows x64 desktop validation run71
    branches:
      - main
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: vag-tech-pro-native-win10-11-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  native-windows-client-lifecycle:
    name: Windows 10/11 x64 clean install and data-preservation lifecycle
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.VAG_TECH_PRO_WIN10_11_RUNNER_AVAILABLE == 'true' }}
    runs-on:
      - self-hosted
      - windows
      - x64
      - vag-tech-pro-win10-11
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - name: Download installers and lifecycle contract from the successful Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vag-tech-pro-windows-x64-run71
          path: ${{ runner.temp }}/vag-tech-pro-win10-11
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pinned Node.js x64 for SQLite integrity checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          architecture: x64

      - name: Verify native Windows client OS, installer hashes and isolated profile
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          if ($os.ProductType -ne 1 -or $os.Caption -notmatch "Windows 10|Windows 11" -or -not [Environment]::Is64BitOperatingSystem) {
            throw "This job requires a native Windows 10/11 x64 client OS; detected $($os.Caption), ProductType=$($os.ProductType), Architecture=$($os.OSArchitecture)."
          }
          $os | Select-Object Caption, Version, BuildNumber, OSArchitecture | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "windows-client-os.json") -Encoding UTF8

          $artifactRoot = Join-Path $env:RUNNER_TEMP "vag-tech-pro-win10-11/windows-lifecycle-staging"
          $metadataPath = Join-Path $artifactRoot "build-metadata.json"
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          if ($metadata.desktop_version -ne "0.2.4") { throw "Unexpected desktop version in build metadata: $($metadata.desktop_version)" }
          if ($metadata.rdw_ru_eaeu_applicability -ne $false -or $metadata.rdw_exact_vehicle_fitment -ne $false -or $metadata.rdw_vehicle_variants -lt 1 -or $metadata.rdw_engine_candidates -lt 1 -or $metadata.rdw_transmission_candidates -lt 1) { throw "RDW pack metadata is missing or violates candidate-only scope." }
          $installer = Join-Path $artifactRoot "VAG-TECH-PRO-Setup-0.2.3-x64.exe"
          $upgradeInstaller = Join-Path $artifactRoot "VAG-TECH-PRO-Setup-0.2.4-x64.exe"
          foreach ($file in @($installer, $upgradeInstaller)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Windows installer artifact is missing: $file" }
            $name = [System.IO.Path]::GetFileName($file)
            $expected = $metadata.installers | Where-Object { $_.name -eq $name } | Select-Object -First 1
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($null -eq $expected -or $expected.sha256 -ne $actual) { throw "Windows installer SHA-256 mismatch: $name" }
          }
          $desktopRoot = Join-Path $artifactRoot "desktop-source"
          $lifecycle = Join-Path $desktopRoot "scripts/windows-installer-lifecycle.ps1"
          foreach ($required in @("data/research/manifest.json", "data/research/rdw-vag-type-approval-cc0/manifest.json", "data/research/rdw-vag-type-approval-cc0/rdw-vag-type-approval.sqlite", "data/source-manifests/rdw-vag-type-approval.lock.json", "lib/rdw-type-approval-db.cjs", "lib/local-core-db.cjs", "scripts/verify-local-core.cjs")) {
            if (-not (Test-Path -LiteralPath (Join-Path $desktopRoot $required))) { throw "Offline lifecycle contract file is missing: $required" }
          }
          if (-not (Test-Path -LiteralPath $lifecycle)) { throw "Windows lifecycle script is missing." }
          $rdwPackDir = Join-Path $desktopRoot "data/research/rdw-vag-type-approval-cc0"
          $rdwManifest = Get-Content -LiteralPath (Join-Path $rdwPackDir "manifest.json") -Raw | ConvertFrom-Json
          $rdwDbPath = Join-Path $rdwPackDir "rdw-vag-type-approval.sqlite"
          $rdwLockPath = Join-Path $desktopRoot "data/source-manifests/rdw-vag-type-approval.lock.json"
          if ($rdwManifest.data_license -ne "CC0-1.0" -or $rdwManifest.verification_status -ne "verified_source_candidate_pack_only" -or $rdwManifest.exact_vehicle_fitment -ne $false -or $rdwManifest.ru_eaeu_applicability -ne $false -or $rdwManifest.vag_factory_engine_code_verified -ne $false -or $rdwManifest.vag_factory_gearbox_code_verified -ne $false -or $rdwManifest.diagnostic_execution_allowed -ne $false) { throw "RDW source/license/applicability boundary failed on native Windows." }
          if ((Get-FileHash -LiteralPath $rdwDbPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $metadata.rdw_database_sha256 -or $rdwManifest.database_sha256 -ne $metadata.rdw_database_sha256) { throw "RDW SQLite SHA-256 mismatch on native Windows." }
          if ((Get-FileHash -LiteralPath $rdwLockPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $metadata.rdw_source_lock_sha256 -or $rdwManifest.source_manifest_sha256 -ne $metadata.rdw_source_lock_sha256) { throw "RDW source-lock SHA-256 mismatch on native Windows." }
          $sourceIndexPath = Join-Path $desktopRoot "data/source-manifests/source-manifest-index.json"
          $sourceIndex = Get-Content -LiteralPath $sourceIndexPath -Raw | ConvertFrom-Json
          $rdwIndexEntry = $sourceIndex.files | Where-Object { $_.name -eq "rdw-vag-type-approval.lock.json" } | Select-Object -First 1
          if ($null -eq $rdwIndexEntry -or $rdwIndexEntry.sha256 -ne $metadata.rdw_source_lock_sha256) { throw "RDW source lock is not covered by the native Windows manifest index." }

          # Windows PowerShell 5.1 needs UseBasicParsing to avoid an IE dependency.
          $scriptText = Get-Content -LiteralPath $lifecycle -Raw
          $stopNeedle = '$ErrorActionPreference = "Stop"'
          if (-not $scriptText.Contains($stopNeedle)) { throw "Lifecycle script startup contract is missing." }
          $assemblyGuard = 'if (-not ("System.Net.Http.HttpClient" -as [type])) { Add-Type -AssemblyName System.Net.Http }'
          $scriptText = $scriptText.Replace($stopNeedle, $stopNeedle + "`r`n" + $assemblyGuard)
          $needle = "Invoke-WebRequest -Uri $baseUrl -TimeoutSec 20"
          if (-not $scriptText.Contains($needle)) { throw "Lifecycle script no longer matches the reviewed PowerShell 5.1 compatibility point." }
          $scriptText = $scriptText.Replace($needle, "Invoke-WebRequest -UseBasicParsing -Uri $baseUrl -TimeoutSec 20")
          [System.IO.File]::WriteAllText($lifecycle, $scriptText, [System.Text.UTF8Encoding]::new($false))

          $isolatedAppData = Join-Path $env:RUNNER_TEMP "vag-tech-pro-win10-11-appdata"
          if (Test-Path -LiteralPath $isolatedAppData) { Remove-Item -LiteralPath $isolatedAppData -Recurse -Force }
          New-Item -ItemType Directory -Path $isolatedAppData -Force | Out-Null
          "installer_0_2_3_sha256=$((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "windows-10-11-verification.txt") -Append -Encoding utf8
          "installer_0_2_4_sha256=$((Get-FileHash -LiteralPath $upgradeInstaller -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "windows-10-11-verification.txt") -Append -Encoding utf8
          "windows_client=$($os.Caption); version=$($os.Version); build=$($os.BuildNumber); architecture=$($os.OSArchitecture)" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "windows-10-11-verification.txt") -Append -Encoding utf8
          "desktop_version=$($metadata.desktop_version)" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "windows-10-11-verification.txt") -Append -Encoding utf8

      - name: Run clean install, offline launch, backup/restore, upgrade and uninstall preservation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $artifactRoot = Join-Path $env:RUNNER_TEMP "vag-tech-pro-win10-11/windows-lifecycle-staging"
          $desktopRoot = Join-Path $artifactRoot "desktop-source"
          $installer = Join-Path $artifactRoot "VAG-TECH-PRO-Setup-0.2.3-x64.exe"
          $upgradeInstaller = Join-Path $artifactRoot "VAG-TECH-PRO-Setup-0.2.4-x64.exe"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "vag-tech-pro-win10-11-appdata"
          Set-Location $desktopRoot
          $lifecycle = Join-Path $desktopRoot "scripts/windows-installer-lifecycle.ps1"
          $log = Join-Path $env:RUNNER_TEMP "windows-10-11-lifecycle.log"
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $lifecycle -InstallerPath $installer -UpgradeInstallerPath $upgradeInstaller 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Native Windows 10/11 installer lifecycle failed." }
          "Windows 10/11 x64 clean install, offline launch, SQLite backup/restore, in-place upgrade, integrity and uninstall-preservation checks passed." | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "windows-10-11-verification.txt") -Append -Encoding utf8

      - name: Upload native Windows 10/11 lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vag-tech-pro-windows-10-11-native-lifecycle
          path: |
            ${{ runner.temp }}/windows-client-os.json
            ${{ runner.temp }}/windows-10-11-verification.txt
            ${{ runner.temp }}/windows-10-11-lifecycle.log
            ${{ runner.temp }}/vag-tech-pro-win10-11/windows-lifecycle-staging/build-metadata.json
          if-no-files-found: warn
          retention-days: 30
  record-build-status:
    name: Record upstream Windows build, test and artifact evidence for the next automation run
    needs:
      - native-windows-client-lifecycle
    if: ${{ always() }}
    runs-on: windows-2025
    timeout-minutes: 10
    concurrency:
      group: vag-tech-pro-status-record
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      UPSTREAM_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      UPSTREAM_STATUS: ${{ github.event.workflow_run.status }}
      UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
      UPSTREAM_URL: ${{ github.event.workflow_run.html_url }}
      WIN10_11_RUNNER_AVAILABLE: ${{ vars.VAG_TECH_PRO_WIN10_11_RUNNER_AVAILABLE }}
      NATIVE_JOB_RESULT: ${{ needs.native-windows-client-lifecycle.result }}
    steps:
      - name: Checkout status branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Query upstream Windows jobs and artifacts and persist the latest verified run
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $base = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:UPSTREAM_RUN_ID"
          $jobsResponse = Invoke-RestMethod -Method Get -Uri "$base/jobs?per_page=100" -Headers $headers
          $artifactsResponse = Invoke-RestMethod -Method Get -Uri "$base/artifacts?per_page=100" -Headers $headers
          $jobRows = @($jobsResponse.jobs | ForEach-Object {
            [ordered]@{
              id = $_.id
              name = $_.name
              status = $_.status
              conclusion = $_.conclusion
              runner_name = $_.runner_name
              started_at = $_.started_at
              completed_at = $_.completed_at
            }
          })
          $artifactRows = @($artifactsResponse.artifacts | ForEach-Object {
            [ordered]@{
              id = $_.id
              name = $_.name
              size_in_bytes = $_.size_in_bytes
              expired = $_.expired
              created_at = $_.created_at
              expires_at = $_.expires_at
            }
          })
          $record = [ordered]@{
            schema_version = 1
            recorded_at_utc = (Get-Date).ToUniversalTime().ToString("o")
            upstream_workflow = "VAG TECH PRO Windows x64 desktop validation run71"
            run_id = [long]$env:UPSTREAM_RUN_ID
            run_number = [int]$env:UPSTREAM_RUN_NUMBER
            run_attempt = [int]$env:UPSTREAM_RUN_ATTEMPT
            status = $env:UPSTREAM_STATUS
            conclusion = $env:UPSTREAM_CONCLUSION
            head_sha = $env:UPSTREAM_SHA
            head_branch = $env:UPSTREAM_BRANCH
            html_url = $env:UPSTREAM_URL
            jobs = $jobRows
            artifacts = $artifactRows
            native_windows_10_11 = [ordered]@{
              runner_gate_enabled = ($env:WIN10_11_RUNNER_AVAILABLE -eq "true")
              lifecycle_job_result = $env:NATIVE_JOB_RESULT
              required_runner_labels = @("self-hosted", "windows", "x64", "vag-tech-pro-win10-11")
            }
            release_ready = $false
            release_readiness_note = "CI evidence only; licensed VAG repair data, exact factory fitment, Windows 10/11 native lifecycle and owner-approved source rights must be independently satisfied."
          }
          $directory = Join-Path $env:GITHUB_WORKSPACE "ci-status"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $statusPath = Join-Path $directory "latest-windows-run.json"
          $record | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $statusPath -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci-status/latest-windows-run.json"
          git commit -m "ci: record Windows validation run $env:UPSTREAM_RUN_NUMBER"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit the Windows validation status record." }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw "Could not rebase the Windows validation status record onto main." }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the Windows validation status record." }
