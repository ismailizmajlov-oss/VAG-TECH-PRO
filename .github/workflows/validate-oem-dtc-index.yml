name: Validate OEM DTC index schema

on:
  push:
    branches: [main]
    paths:
      - data/schemas/oem-dtc-index.schema.json
      - data/sql/oem-dtc-index.sql
      - data/sql/vehicle-catalog.sql
      - data/sql/technical-library.sql
      - data/sql/otts-type-approval-evidence.sql
      - data/sql/generic-repair-guidance.sql
      - tests/test_provenance_hash_guards.py
      - scripts/validate-oem-dtc-index.py
      - scripts/audit-dtc-overlap.cjs
      - tests/dtc-overlap-audit.test.cjs
      - tests/test_technical_library_schema.py
      - .github/workflows/validate-oem-dtc-index.yml
  pull_request:
    paths:
      - data/schemas/oem-dtc-index.schema.json
      - data/sql/oem-dtc-index.sql
      - data/sql/vehicle-catalog.sql
      - data/sql/technical-library.sql
      - data/sql/otts-type-approval-evidence.sql
      - data/sql/generic-repair-guidance.sql
      - tests/test_provenance_hash_guards.py
      - scripts/validate-oem-dtc-index.py
      - scripts/audit-dtc-overlap.cjs
      - tests/dtc-overlap-audit.test.cjs
      - tests/test_technical_library_schema.py
      - .github/workflows/validate-oem-dtc-index.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
      - name: Validate JSON contract, SQLite range guards and technical-library regressions
        run: |
          python scripts/validate-oem-dtc-index.py
          python -m unittest discover -s tests -p "test_technical_library_schema.py"
          python -m unittest discover -s tests -p "test_provenance_hash_guards.py" -v
          node --check scripts/audit-dtc-overlap.cjs
          node --test tests/dtc-overlap-audit.test.cjs
