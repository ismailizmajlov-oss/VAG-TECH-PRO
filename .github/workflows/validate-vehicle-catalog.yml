name: Validate VIN-free vehicle catalog schema

on:
  push:
    branches: [main]
    paths:
      - 'data/sql/vehicle-catalog.sql'
      - 'scripts/test-vehicle-catalog-schema.py'
      - '.github/workflows/validate-vehicle-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate SQLite schema and evidence gates
        run: python scripts/test-vehicle-catalog-schema.py
