name: Validate Windows VIN-free vehicle catalog and DTC evidence schema

on:
  push:
    branches:
      - main
      - automation/windows-offline-data-foundation-run18
    paths:
      - 'data/sql/vehicle-catalog.sql'
      - 'scripts/test-vehicle-catalog-schema.py'
      - 'data/sql/oem-dtc-index.sql'
      - 'data/sql/dtc-catalog-links.sql'
      - 'scripts/test-dtc-catalog-links.py'
      - '.github/workflows/validate-vehicle-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate SQLite vehicle taxonomy and evidence gates
        run: python scripts/test-vehicle-catalog-schema.py
      - name: Validate DTC namespace separation, publication rights and vehicle links
        run: python scripts/test-dtc-catalog-links.py
