          node scripts/integrate-wikidata-vag-generation-candidates.cjs --pack-dir "$packDir" --research-dir "desktop-source/data/research" 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/wikidata-generation-integration-run70.log"
          if ($LASTEXITCODE -ne 0) { throw "Run70 Wikidata generation candidate integration failed" }
          $evidencePath = "desktop-source/data/research/wikidata-vag-generation-candidates-cc0/integration-verification.json"
