          if ($evidence.status -ne "verified_candidate_reference_only" -or $evidence.rows.generic_namespace_rows -ne 0 -or $evidence.exact_vehicle_fitment -ne $false -or $evidence.vag_oem_confirmation -ne $false -or $evidence.diagnostic_execution_allowed -ne $false) { throw "Run59 candidate-browser evidence failed the separation/safety gate" }
          "mechanicdb_candidate_browser=separate_namespace; rows=2; OEM_fitment=none; generic_DTC_leakage=0; execution=disabled" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8

      - name: Integrate verified CC0 Wikidata VAG model identity pack (run68)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check apply-wikidata-vag-taxonomy-run68.cjs
          if ($LASTEXITCODE -ne 0) { throw "Run68 Wikidata integration script syntax check failed" }
          $packDir = Join-Path $env:RUNNER_TEMP "vag-tech-pro-wikidata"
          node apply-wikidata-vag-taxonomy-run68.cjs --pack-dir "$packDir" --research-dir "desktop-source/data/research" 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/wikidata-integration-run68.log"
          if ($LASTEXITCODE -ne 0) { throw "Run68 Wikidata CC0 pack integration failed" }
          $evidencePath = "desktop-source/data/research/wikidata-vag-model-taxonomy-cc0/desktop-integration-verification.json"
          if (-not (Test-Path $evidencePath)) { throw "Run68 Wikidata desktop integration evidence is missing" }
