        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s tests -p "test_wikidata_generation_source_rights.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Wikidata generation source-rights gate failed" }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/42146307991/artifacts?per_page=100"
          $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          $artifact = $response.artifacts | Where-Object { $_.id -eq 13470966164 -and $_.name -eq "wikidata-vag-generation-candidates-cc0" -and $_.expired -eq $false } | Select-Object -First 1
          if ($null -eq $artifact) { throw "Pinned Wikidata generation artifact is missing or expired." }
          if ($artifact.digest -ne "sha256:dc10b4b6b8a2f433802cc335e7c50f4f18e2642b9a09d0608b3de6e1b93d82bb") { throw "Pinned generation artifact digest mismatch: $($artifact.digest)" }
          $packDir = Join-Path $env:RUNNER_TEMP "vag-tech-pro-wikidata-generations"
          $manifest = Get-Content -LiteralPath (Join-Path $packDir "manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.pack_id -ne "wikidata-vag-generation-candidates-cc0-69cf847b7ef6" -or $manifest.source_id -ne "wikidata-vag-generation-candidates" -or $manifest.source_revision -ne "wikidata-generation-candidates-69cf847b7ef6") { throw "Wikidata generation snapshot identity/revision mismatch." }
