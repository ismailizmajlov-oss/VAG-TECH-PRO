permissions:
  contents: read
  actions: read

concurrency:
  group: vag-tech-pro-windows-x64-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - name: Checkout build manifest and source payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22 x64
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Setup Python 3.12 x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Validate offline data-pack tooling and rights boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          python tests/test_windows_desktop_workflow_contract.py
          python tests/test_source_manifest_bundle.py -v
          python tests/test_technical_library_schema.py -v
          python -m py_compile scripts/vag_identity_vehiclesdb_common.py scripts/build_vag_identity_vehiclesdb.py scripts/verify_vag_identity_vehiclesdb.py scripts/test_vag_identity_vehiclesdb.py scripts/build_offline_data_pack_index.py scripts/verify_offline_data_pack_index.py
          python scripts/test_vag_identity_vehiclesdb.py
          python tests/test_offline_data_pack_rights.py
          python tests/test_otts_bot_source_rights.py
          python tests/test_openvag_source_rights.py
          python tests/test_open_vehicle_schema_source_review.py
          python tests/test_wal33d_dtc_candidate_rights.py
          python tests/test_decode_tr_source_rights.py
          node --test tests/authorized-fgis-otts-export.test.cjs
          python -m py_compile scripts/import_eaeu_otts_registry_export.py
          python tests/test_russian_eaeu_otts_manifest.py
          python tests/test_eaeu_otts_registry_manifest.py
          python tests/test_eaeu_otts_registry_import.py
          python tests/test_vw_flash_simos18_dtc_quarantine.py
          python tests/test_astra_ch_tas_desktop_integration.py


      - name: Reassemble and verify pinned desktop source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $encoded = (Get-Content -LiteralPath "desktop-source-run34.zip.b64" -Raw) -replace "\s", ""
          if ($encoded.Length -ne 566352) { throw "Unexpected desktop source base64 length: $($encoded.Length)" }
          $bytes = [Convert]::FromBase64String($encoded)
          if ($bytes.Length -ne 424764) { throw "Unexpected desktop source archive length: $($bytes.Length)" }
          $zipPath = Join-Path $env:RUNNER_TEMP "desktop-source-run34.zip"
          [System.IO.File]::WriteAllBytes($zipPath, $bytes)
          $actual = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content -LiteralPath "desktop-source-run34.zip.sha256" -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          if ($actual -ne $expected) { throw "Desktop source archive SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $zipPath -DestinationPath "desktop-source" -Force
          if (-not (Test-Path "desktop-source/package.json")) { throw "Desktop package.json was not extracted." }
          Copy-Item -LiteralPath "desktop-package-run35.json" -Destination "desktop-source/package.json" -Force
          $desktopDataRoot = Join-Path (Get-Location) "desktop-source/data"
          foreach ($folder in @("sql", "schemas")) {
            $sourceFolder = Join-Path (Get-Location) ("data/" + $folder)
            $targetFolder = Join-Path $desktopDataRoot $folder
            if (-not (Test-Path -LiteralPath $sourceFolder -PathType Container)) { throw "Required desktop data folder is missing: $sourceFolder" }
            New-Item -ItemType Directory -Path $targetFolder -Force | Out-Null
            Copy-Item -Path (Join-Path $sourceFolder "*") -Destination $targetFolder -Recurse -Force
          }

          $patches = @(
            @{ File = "run36-01-manifest.patch.gz.b64"; GzipSha = "af9b133cbcb557f69935e6b615d1cef094d87cc83cad1ad0bedb4a81b983f1dd"; PatchSha = "195003ca7ad428b14c877b3c2f4586fc4320c50ae9c9353a87508efd2b0c907e" },
            @{ File = "run36-02-api-db.patch.gz.b64"; GzipSha = "0a927dbbc96e04198fa44f00d90b91b1a823b042e1d0fb33b16f446154b12331"; PatchSha = "554ac86467b5713879c254734df05d6419609ff8c5a93e5edb3c4c309567acbb" },
            @{ File = "run36-03-ui.patch.gz.b64"; GzipSha = "dc38f48043f2d7fe75d8a8e368e1b30c55da0e1b1a8f7b9cdc93eb6d7b6c51e8"; PatchSha = "abccb6706d44155469fe96a6e21f039c8c33a7fd59407a92b55288a67ce46ae3" },
            @{ File = "run36-04-verification-tests.patch.gz.b64"; GzipSha = "48a649d7babfdf028a64432cab8c4c212e6584e3e2ea7b77bdd1221cc2f88b2d"; PatchSha = "3dbc26d866cf76feabacb7eaba2618ad4cba922d2aa3dae2aead360d8c4e7692" }
          )
          foreach ($patch in $patches) {
            $encodedPatch = (Get-Content -LiteralPath $patch.File -Raw) -replace "\s", ""
            $compressed = [Convert]::FromBase64String($encodedPatch)
            $gzipHash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($compressed)).ToLowerInvariant()
            if ($gzipHash -ne $patch.GzipSha) { throw "Run36 patch gzip SHA-256 mismatch: $($patch.File) expected $($patch.GzipSha) actual $gzipHash" }
            $inputStream = [System.IO.MemoryStream]::new([byte[]]$compressed)
            $gzipStream = [System.IO.Compression.GZipStream]::new($inputStream, [System.IO.Compression.CompressionMode]::Decompress)
            $outputStream = [System.IO.MemoryStream]::new()
            $gzipStream.CopyTo($outputStream)
            $patchBytes = $outputStream.ToArray()
            $patchHash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($patchBytes)).ToLowerInvariant()
            if ($patchHash -ne $patch.PatchSha) { throw "Run36 patch SHA-256 mismatch: $($patch.File) expected $($patch.PatchSha) actual $patchHash" }
            $patchPath = Join-Path $env:RUNNER_TEMP ($patch.File.Replace(".gz.b64", ".patch"))
            [System.IO.File]::WriteAllBytes($patchPath, $patchBytes)
            git apply --check --unsafe-paths --directory=desktop-source $patchPath
            if ($LASTEXITCODE -ne 0) { throw "Run36 patch check failed: $($patch.File)" }
            git apply --unsafe-paths --directory=desktop-source $patchPath
            if ($LASTEXITCODE -ne 0) { throw "Run36 patch application failed: $($patch.File)" }
            "patch_sha256=$($patch.PatchSha)" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8
            $gzipStream.Dispose(); $inputStream.Dispose(); $outputStream.Dispose()
          }
          node --check apply-desktop-hardening-run35.cjs
          node apply-desktop-hardening-run35.cjs
          node --check apply-local-core-host-origin-run51.cjs
          node apply-local-core-host-origin-run51.cjs 2>&1 | Tee-Object -FilePath "local-core-host-origin-patch.log"
          if ($LASTEXITCODE -ne 0) { throw "Local-core Host/Origin hardening patch failed" }
          "source_archive_sha256=$actual" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8

      - name: Resolve latest successful Windows offline data-pack bundle for this revision
        id: offline-packs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            $branch = [string]$event.pull_request.head.ref
            $expectedHeadSha = [string]$event.pull_request.head.sha
          } else {
            $branch = [string]$env:GITHUB_REF_NAME
            $expectedHeadSha = [string]$env:GITHUB_SHA
          }
          if ([string]::IsNullOrWhiteSpace($branch) -or $expectedHeadSha -notmatch "^[a-f0-9]{40}$") {
            throw "Cannot resolve the source branch/commit for the offline data-pack build."
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $encodedBranch = [uri]::EscapeDataString($branch)
          $branchUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/build-windows-offline-data-packs.yml/runs?branch=$encodedBranch&per_page=100"
          $run = $null
          $fallbackUsed = $false
          $response = $null
          try {
            $response = Invoke-RestMethod -Method Get -Uri $branchUri -Headers $headers -TimeoutSec 20
          } catch {
            Write-Output "Initial branch data-pack lookup failed; retrying while checking for a previously successful bundle: $($_.Exception.Message)"
          }
          if ($null -eq $response) {
            for ($attempt = 1; $attempt -le 3 -and $null -eq $response; $attempt++) {
              try {
                $response = Invoke-RestMethod -Method Get -Uri $branchUri -Headers $headers -TimeoutSec 20
              } catch {
                Write-Output "Initial branch data-pack lookup retry $attempt failed: $($_.Exception.Message)"
              }
              if ($null -eq $response) { Start-Sleep -Seconds 10 }
            }
          }

          $currentRun = $null
          if ($null -ne $response) {
            $currentRun = $response.workflow_runs |
              Where-Object { $_.head_sha -eq $expectedHeadSha -and $_.event -in @("push", "pull_request", "workflow_dispatch") } |
              Sort-Object { [datetime]$_.created_at } -Descending |
              Select-Object -First 1
          }

          if ($null -ne $currentRun) {
            # A data-pack workflow for this exact source commit takes precedence over
            # any older bundle. Never fall back while the matching run is queued or in progress.
            if ($currentRun.status -eq "completed") {
              if ($currentRun.conclusion -ne "success") {
                throw "The offline data-pack workflow for this exact source commit failed: run $($currentRun.id), conclusion $($currentRun.conclusion)."
              }
              $run = $currentRun
            } else {
              for ($attempt = 1; $attempt -le 60; $attempt++) {
                Start-Sleep -Seconds 10
                try {
                  $response = Invoke-RestMethod -Method Get -Uri $branchUri -Headers $headers -TimeoutSec 20
                  $currentRun = $response.workflow_runs |
                    Where-Object { $_.head_sha -eq $expectedHeadSha -and $_.event -in @("push", "pull_request", "workflow_dispatch") } |
                    Sort-Object { [datetime]$_.created_at } -Descending |
                    Select-Object -First 1
                  if ($null -eq $currentRun) { continue }
                  if ($currentRun.status -eq "completed") {
                    if ($currentRun.conclusion -ne "success") {
                      throw "The offline data-pack workflow for this exact source commit failed: run $($currentRun.id), conclusion $($currentRun.conclusion)."
                    }
                    $run = $currentRun
                    break
                  }
                  Write-Output "Waiting for current-revision Windows offline data-pack run $($currentRun.id), status $($currentRun.status), attempt $attempt/60."
                } catch {
                  if ($_.Exception.Message -like "The offline data-pack workflow for this exact source commit failed:*") { throw }
                  Write-Output "Current-revision data-pack lookup attempt $attempt failed: $($_.Exception.Message)"
                }
              }
              if ($null -eq $run) {
                throw "The current-revision Windows offline data-pack workflow did not complete successfully within the wait window; refusing an older bundle."
              }
            }
          } else {
            # No data-pack run was triggered for this commit. Reuse is permitted only
            # after the next step verifies every source, index and database hash.
            $previousBranchRun = @()
            if ($null -ne $response) {
              $previousBranchRun = $response.workflow_runs |
                Where-Object { $_.head_sha -ne $expectedHeadSha -and $_.status -eq "completed" -and $_.conclusion -eq "success" -and $_.event -in @("push", "pull_request", "workflow_dispatch") } |
                Sort-Object { [datetime]$_.created_at } -Descending |
                Select-Object -First 1
            }
            if ($null -ne $previousBranchRun -and @($previousBranchRun).Count -gt 0) {
              $run = $previousBranchRun
              $fallbackUsed = $true
              Write-Output "No current-revision data-pack run exists; using previous successful same-branch bundle $($run.id), subject to independent hash verification."
            }
          }

          if ($null -eq $run) {
            $mainUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/build-windows-offline-data-packs.yml/runs?branch=main&per_page=100"
            $mainResponse = Invoke-RestMethod -Method Get -Uri $mainUri -Headers $headers -TimeoutSec 20
            $run = $mainResponse.workflow_runs |
              Where-Object { $_.status -eq "completed" -and $_.conclusion -eq "success" -and $_.event -in @("push", "pull_request", "workflow_dispatch") } |
              Sort-Object { [datetime]$_.created_at } -Descending |
              Select-Object -First 1
            $fallbackUsed = $true
          }
          if ($null -eq $run -or $run.status -ne "completed" -or $run.conclusion -ne "success") {
            throw "No successful offline data-pack bundle is available for this revision or a hash-compatible fallback."
          }
                    $artifactUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/artifacts?per_page=100"
          $artifactResponse = Invoke-RestMethod -Method Get -Uri $artifactUri -Headers $headers -TimeoutSec 20
          $artifact = $artifactResponse.artifacts |
            Where-Object { $_.name -eq "vag-tech-pro-windows-offline-data-packs" -and $_.expired -eq $false } |
            Select-Object -First 1
          if ($null -eq $artifact) { throw "Verified Windows offline data-pack artifact is missing or expired for run $($run.id)." }
          $artifactDigest = ([string]$artifact.digest) -replace "^sha256:", ""
          if ($artifactDigest -notmatch "^[a-f0-9]{64}$") { throw "Offline data-pack artifact digest is invalid: $($artifact.digest)" }
          "run_id=$($run.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "head_sha=$($run.head_sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_id=$($artifact.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_sha256=$artifactDigest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "fallback_used=$($fallbackUsed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8


      - name: Download verified Windows offline data-pack bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vag-tech-pro-windows-offline-data-packs
          path: ${{ runner.temp }}/vag-tech-pro-data-packs
          run-id: ${{ steps.offline-packs.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Independently verify downloaded Windows offline data-pack bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packRoot = Join-Path $env:RUNNER_TEMP "vag-tech-pro-data-packs"
          python scripts/verify_offline_data_pack_index.py --pack-dir $packRoot
          if ($LASTEXITCODE -ne 0) { throw "Downloaded offline data-pack bundle failed independent verification." }
          $indexPath = Join-Path $packRoot "offline-data-pack-index.json"
          if (-not (Test-Path -LiteralPath $indexPath -PathType Leaf)) { throw "Offline data-pack index is missing." }
          $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
          if ($index.bundle_status -ne "verified_offline_data_packs_not_installer" -or $index.target_platform -ne "windows-x64" -or $index.database_count -ne 3) {
            throw "Downloaded offline data-pack index has an unexpected product boundary."
          }
          "offline_data_pack_run_id=${{ steps.offline-packs.outputs.run_id }}" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8
          "offline_data_pack_sha256=${{ steps.offline-packs.outputs.artifact_sha256 }}" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8

      - name: Download MechanicDB candidate pack
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mechanicdb-audi-vw-dtc-candidates-odbl-research
          path: ${{ runner.temp }}/vag-tech-pro-mechanicdb
          run-id: 41622526550
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest successful AutoDiag2 policy-gated pack
        id: autodiag2-run
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/acquire-autodiag2-vag-candidates.yml/runs?branch=main&per_page=10"
          $run = $null
          for ($attempt = 1; $attempt -le 40; $attempt++) {
            $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
            $run = $response.workflow_runs |
              Where-Object { $_.head_branch -eq "main" -and $_.event -in @("push", "workflow_dispatch") } |
              Sort-Object { [datetime]$_.created_at } -Descending |
              Select-Object -First 1
            if ($null -eq $run) { throw "No AutoDiag2 candidate-pack workflow run was found on main." }
            if ($run.status -eq "completed") { break }
            Start-Sleep -Seconds 15
          }
          if ($run.status -ne "completed" -or $run.conclusion -ne "success") {
            throw "Latest AutoDiag2 workflow did not complete successfully. Run=$($run.id), status=$($run.status), conclusion=$($run.conclusion)"
          }
          $artifactUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/artifacts?per_page=100"
          $artifactResponse = Invoke-RestMethod -Method Get -Uri $artifactUri -Headers $headers
          $artifact = $artifactResponse.artifacts | Where-Object { $_.name -eq "autodiag2-vag-community-candidate-pack" -and $_.expired -eq $false } | Select-Object -First 1
          if ($null -eq $artifact) { throw "AutoDiag2 candidate-pack artifact is missing or expired for run $($run.id)." }
          $artifactDigest = ([string]$artifact.digest) -replace "^sha256:", ""
          if ($artifactDigest -notmatch "^[a-f0-9]{64}$") { throw "AutoDiag2 artifact digest is not a valid SHA-256: $($artifact.digest)" }
          "run_id=$($run.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "head_sha=$($run.head_sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_id=$($artifact.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_sha256=$artifactDigest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download AutoDiag2 community candidate pack
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autodiag2-vag-community-candidate-pack
          path: ${{ runner.temp }}/vag-tech-pro-autodiag2
          run-id: ${{ steps.autodiag2-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify AutoDiag2 rights and attribution gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifestPath = Join-Path $env:RUNNER_TEMP "vag-tech-pro-autodiag2/manifest.json"
          if (-not (Test-Path $manifestPath)) { throw "AutoDiag2 manifest is missing." }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.pack_id -ne "autodiag2-vag-community-v6") { throw "Unexpected AutoDiag2 pack ID." }
          if ($manifest.dtc_policy_filtered -ne $true) { throw "AutoDiag2 DTC attribution filter has not run." }
          if ($manifest.license.database -ne "ODbL-1.0" -or $manifest.license.contents -ne "DbCL-1.0") { throw "AutoDiag2 license metadata mismatch." }
          if ($manifest.license.commercial_use_allowed -ne $true -or $manifest.license.display_allowed -ne $true -or $manifest.license.offline_cache_allowed -ne $true -or $manifest.license.redistribution_allowed -ne $true) { throw "AutoDiag2 reuse rights are incomplete." }
          if ($manifest.license.separate_pack_required -ne $true) { throw "AutoDiag2 ODbL pack must remain separate." }
          if ($manifest.market_scope -ne "UNKNOWN") { throw "AutoDiag2 market scope must remain UNKNOWN." }
          if ($manifest.counts.make_level_dtc_candidates -ne 0 -or $manifest.counts.generic_dtc_rows_in_pack -ne 0) { throw "Unattributed or generic DTC records remain in the pack." }
          if ($manifest.counts.vag_specific_dtc_verified_rows -ne 0 -or $manifest.counts.engine_codes_verified -ne 0 -or $manifest.counts.transmission_records -ne 0) { throw "Candidate pack incorrectly claims verified OEM data." }
          if ($manifest.dtc_candidate_policy.diagnostic_execution_allowed -ne $false -or $manifest.dtc_candidate_policy.repair_advice_approved -ne $false) { throw "Unverified DTC candidates must not be actionable." }
          if ($manifest.engine_code_policy.shape_heuristic_is_not_used_for_verification -ne $true) { throw "Engine-code shape heuristic is not explicitly disabled." }
          Write-Output "AutoDiag2 rights, attribution, market and applicability gates passed."

      - name: Download pinned CC0 Wikidata VAG model identity snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wikidata-vag-model-taxonomy-cc0
          path: ${{ runner.temp }}/vag-tech-pro-wikidata
          run-id: 42145993840
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify pinned Wikidata artifact digest and source revision
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/42145993840/artifacts?per_page=100"
          $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          $artifact = $response.artifacts | Where-Object { $_.id -eq 13469673252 -and $_.name -eq "wikidata-vag-model-taxonomy-cc0" -and $_.expired -eq $false } | Select-Object -First 1
          if ($null -eq $artifact) { throw "Pinned Wikidata artifact is missing or expired." }
          if ($artifact.digest -ne "sha256:f9ef2e5178e1dcdd92c0969a229c2e33a5608f14c9cf2f67ffc6f4baa21114e8") { throw "Pinned Wikidata artifact digest mismatch: $($artifact.digest)" }
          $packDir = Join-Path $env:RUNNER_TEMP "vag-tech-pro-wikidata"
          $manifest = Get-Content -LiteralPath (Join-Path $packDir "manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.pack_id -ne "wikidata-vag-model-taxonomy-cc0-630dbed1af15" -or $manifest.source_revision -ne "wikidata-snapshot-630dbed1af15") { throw "Wikidata snapshot revision mismatch." }
          if ($manifest.data_license -ne "CC0-1.0" -or $manifest.rights_status -ne "approved_by_published_license" -or $manifest.scope.market_scope -ne "UNKNOWN" -or $manifest.scope.applicability_precision -ne "candidate_identity_only") { throw "Wikidata rights or candidate-only scope mismatch." }
          "wikidata_artifact_sha256=f9ef2e5178e1dcdd92c0969a229c2e33a5608f14c9cf2f67ffc6f4baa21114e8" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8
          "wikidata_source_revision=$($manifest.source_revision)" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8

      - name: Assemble and verify offline SQLite research packs
        shell: pwsh
        env:
          AUTODIAG2_RUN_ID: ${{ steps.autodiag2-run.outputs.run_id }}
          AUTODIAG2_ARTIFACT_ID: ${{ steps.autodiag2-run.outputs.artifact_id }}
          AUTODIAG2_ARTIFACT_SHA256: ${{ steps.autodiag2-run.outputs.artifact_sha256 }}
          AUTODIAG2_COMMIT_SHA: ${{ steps.autodiag2-run.outputs.head_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $packs = Join-Path $env:RUNNER_TEMP "vag-tech-pro-data-packs"
          $mechanic = Join-Path $env:RUNNER_TEMP "vag-tech-pro-mechanicdb"
          $autodiag2 = Join-Path $env:RUNNER_TEMP "vag-tech-pro-autodiag2"
          $research = Join-Path $env:GITHUB_WORKSPACE "desktop-source/data/research"
          $mappings = @(
            @{ Source = "obdex-generic-cc0"; Target = "obdex-generic-cc0" },
            @{ Source = "obdb-vag-signals-cc-by-sa"; Target = "obdb-vag-signals-cc-by-sa" },
            @{ Source = "vehiclesdb-vag-identity"; Target = "vehiclesdb-vag-identity" }
          )
          foreach ($mapping in $mappings) {
            $from = Join-Path $packs $mapping.Source
            $to = Join-Path $research $mapping.Target
            if (-not (Test-Path $from)) { throw "Missing downloaded research pack: $($mapping.Source)" }
            New-Item -ItemType Directory -Force -Path $to | Out-Null
            Copy-Item -Path (Join-Path $from "*") -Destination $to -Recurse -Force
          }
          $obdexDb = Join-Path $research "obdex-generic-cc0/generated/obdex-generic-research.sqlite"
          if (-not (Test-Path $obdexDb)) { throw "Missing generated generic OBDex SQLite database." }
          Copy-Item -LiteralPath $obdexDb -Destination (Join-Path $research "obdex-generic-cc0/generic-obdex-research.sqlite") -Force
          node scripts/sync-desktop-research-manifest.cjs --pack-dir $packs --research-dir $research 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/offline-data-pack-manifest-sync.log"
          if ($LASTEXITCODE -ne 0) { throw "Offline data-pack manifest synchronization failed" }
          "offline_research_manifest=sha256_verified_from_current_pack_bundle" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8
          $mechanicTarget = Join-Path $research "mechanicdb-vag-dtc-candidates-odbl"
          New-Item -ItemType Directory -Force -Path $mechanicTarget | Out-Null
          Copy-Item -Path (Join-Path $mechanic "*") -Destination $mechanicTarget -Recurse -Force
          $autodiag2Target = Join-Path $research "autodiag2-vag-community-candidates-odbl"
          if (-not (Test-Path $autodiag2)) { throw "Missing downloaded AutoDiag2 candidate pack." }
          New-Item -ItemType Directory -Force -Path $autodiag2Target | Out-Null
          Copy-Item -Path (Join-Path $autodiag2 "*") -Destination $autodiag2Target -Recurse -Force
          foreach ($db in @(
            "obdex-generic-cc0/generic-obdex-research.sqlite",
            "obdb-vag-signals-cc-by-sa/vag-obdb-research.sqlite",
            "vehiclesdb-vag-identity/vag-identity-vehiclesdb.sqlite",
            "mechanicdb-vag-dtc-candidates-odbl/mechanicdb-vag-dtc-candidates.sqlite",
            "autodiag2-vag-community-candidates-odbl/autodiag2-vag-community.sqlite"
          )) {
            if (-not (Test-Path (Join-Path $research $db))) { throw "Research database missing after assembly: $db" }
          }
          $provenance = [ordered]@{
            workflow_run_id = [long]$env:AUTODIAG2_RUN_ID
            artifact_id = [long]$env:AUTODIAG2_ARTIFACT_ID
            artifact_sha256 = [string]$env:AUTODIAG2_ARTIFACT_SHA256
            commit = [string]$env:AUTODIAG2_COMMIT_SHA
          }
          $provenance | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "desktop-source/autodiag2-build-provenance.json") -Encoding utf8

      - name: Exclude VAG identity source pending upstream provenance review
