      - name: Resolve pinned CarDir VAG owner-manual facts pack from source register
        id: cardir-pack
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $register = Get-Content -LiteralPath "data/source-manifests/vag-factory-source-register.json" -Raw | ConvertFrom-Json -AsHashtable
          $source = @($register.sources | Where-Object { $_.source_id -eq "cardir-vag-owner-manual-facts-cc-by-4.0" }) | Select-Object -First 1
          if (-not $source) { throw "CarDir source register entry is missing." }
          if ($source.data_ingested -ne $false -or $source.product_import_allowed -ne $false -or $source.market_scope -notcontains "UNKNOWN") { throw "CarDir research pack must remain non-production and market UNKNOWN." }
          $pack = $source.research_pack
          if ($pack.status -ne "verified_research_only" -or $pack.pack_build_status -ne "verified_research_only") { throw "CarDir source register does not pin a verified research-only pack." }
          $sourceManifestPath = "data/source-manifests/cardir-vag-owner-manual-facts-cc-by-4.0.json"
          $sourceManifest = Get-Content -LiteralPath $sourceManifestPath -Raw | ConvertFrom-Json -AsHashtable
          $sourceManifestSha = (Get-FileHash -LiteralPath $sourceManifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSnapshotSha = ([string]$sourceManifest.snapshot.source_snapshot_sha256).ToLowerInvariant()
          if ($pack.source_manifest_sha256 -ne $sourceManifestSha -or $pack.source_snapshot_sha256 -ne $expectedSnapshotSha) { throw "Pinned CarDir artifact does not match the current source manifest and exact source snapshot." }
          $runId = [long]$pack.artifact_run_id
          $runNumber = [long]$pack.artifact_run_number
          $artifactId = [long]$pack.artifact_id
          $artifactName = [string]$pack.artifact_name
          $expectedDigest = ([string]$pack.artifact_sha256).ToLowerInvariant()
          $expectedSize = [long]$pack.artifact_size_bytes
          if ($runId -le 0 -or $runNumber -le 0 -or $artifactId -le 0 -or $expectedDigest -notmatch "^[a-f0-9]{64}$" -or [string]::IsNullOrWhiteSpace($artifactName) -or $expectedSize -le 0) { throw "CarDir artifact pin is incomplete or invalid." }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $run = Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$runId" -Headers $headers -Method Get -TimeoutSec 30
          if ($run.status -ne "completed" -or $run.conclusion -ne "success" -or [long]$run.run_number -ne $runNumber) { throw "Pinned CarDir source-pack run is not a successful completed run. Run=$runId, status=$($run.status), conclusion=$($run.conclusion)." }
          $artifactUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/artifacts?per_page=100"
          $artifactResponse = Invoke-RestMethod -Uri $artifactUri -Headers $headers -Method Get -TimeoutSec 30
          $artifact = @($artifactResponse.artifacts | Where-Object { [long]$_.id -eq $artifactId }) | Select-Object -First 1
          if (-not $artifact -or $artifact.expired -or $artifact.name -ne $artifactName -or [long]$artifact.size_in_bytes -ne $expectedSize) { throw "Pinned CarDir artifact id/name/size is missing, expired or mismatched." }
          $digest = ([string]$artifact.digest -replace "^sha256:", "").ToLowerInvariant()
          if ($digest -ne $expectedDigest) { throw "Pinned CarDir artifact digest differs from the source register." }
          "run_id=$runId" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "run_number=$runNumber" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "artifact_sha256=$expectedDigest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "artifact_id=$artifactId" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "CarDir pinned artifact id: $artifactId; source run #$runNumber / $runId" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "CarDir exact source manifest SHA-256: $sourceManifestSha" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "CarDir exact source snapshot SHA-256: $expectedSnapshotSha" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "CarDir artifact SHA-256: $expectedDigest" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

