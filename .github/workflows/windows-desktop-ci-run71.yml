      - name: Create desktop source inventory for technical-section audit
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE "desktop-source"
          if (-not (Test-Path -LiteralPath $sourceRoot -PathType Container)) { throw "Extracted desktop source is missing." }
          $files = @(Get-ChildItem -LiteralPath $sourceRoot -Recurse -File | Where-Object { $_.FullName -notmatch '[\\\\](node_modules|\\.next|release|out|coverage)[\\\\]' })
          $relativeFiles = @($files | ForEach-Object { $_.FullName.Substring($sourceRoot.Length + 1) } | Sort-Object)
          $relativeFiles | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "desktop-source-inventory.txt") -Encoding utf8
          $patterns = @(
            'searchVerifiedTechnicalRecords','listVerifiedConfigurations','getModuleCoverage','review_status','approveSourceByOwner','listSources','listImportBatches','technical_records','source_snapshots','vehicle_configurations','applicability_precision','source_snapshot_sha256',
            'saveUserVehicle','getUserVehicles','addBookmark','getBookmarks','query_history',
            'importPackage','backupDatabase','restoreDatabase',
            'dtc_generic','dtc_vag_specific','diagnostic_test_plan','repair_procedure',
            'wiring_diagram','pinout','torque_specification','adaptation','service_interval',
            'ecu_reference','oem_part','oem_supersession'
          )
          $codeFiles = @($files | Where-Object { $_.Extension -in @('.ts','.tsx','.js','.cjs','.mjs','.sql') })
          $codeMatches = @($codeFiles | Select-String -Pattern $patterns)
          $matchLines = @($codeMatches | Select-Object -First 500 | ForEach-Object {
            $relative = $_.Path.Substring($sourceRoot.Length + 1)
            "{0}:{1}: {2}" -f $relative,$_.LineNumber,$_.Line.Trim()
          })
          $matchLines | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "desktop-source-technical-surface.txt") -Encoding utf8
          "desktop_source_file_count=$($files.Count)" | Out-File -FilePath (Join-Path $env:GITHUB_WORKSPACE "desktop-source-technical-surface.txt") -Append -Encoding utf8
          "technical_surface_match_count=$($codeMatches.Count)" | Out-File -FilePath (Join-Path $env:GITHUB_WORKSPACE "desktop-source-technical-surface.txt") -Append -Encoding utf8

      - name: Stage Windows 2022 lifecycle verification payload
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "windows-lifecycle-staging"
          if (Test-Path $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($name in @("VAG-TECH-PRO-Setup-0.2.3-x64.exe", "VAG-TECH-PRO-Setup-0.2.4-x64.exe")) {
            $source = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $source) { Copy-Item -LiteralPath $source -Destination (Join-Path $stage $name) -Force }
          }
          foreach ($name in @("build-metadata.json", "source-verification.txt", "package-resource-verification.txt")) {
            if (Test-Path $name) { Copy-Item -LiteralPath $name -Destination (Join-Path $stage $name) -Force }
          }
          $desktopStage = Join-Path $stage "desktop-source"
          New-Item -ItemType Directory -Path $desktopStage -Force | Out-Null
          Copy-Item -LiteralPath "desktop-source/package.json" -Destination $desktopStage -Force
          foreach ($folder in @("scripts", "lib", "app", "components", "electron", "tests", "public", "styles", "types", "pages", "src", "docs", "data/research", "data/source-manifests", "data/sql", "data/schemas")) {
            $sourceFolder = Join-Path "desktop-source" $folder
            $targetFolder = Join-Path $desktopStage $folder
            New-Item -ItemType Directory -Path $targetFolder -Force | Out-Null
            if (Test-Path $sourceFolder) { Copy-Item -Path (Join-Path $sourceFolder "*") -Destination $targetFolder -Recurse -Force }
          }
