        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "windows-lifecycle-staging"
          if (Test-Path $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($name in @("VAG-TECH-PRO-Setup-0.2.3-x64.exe", "VAG-TECH-PRO-Setup-0.2.4-x64.exe")) {
            $source = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $source) { Copy-Item -LiteralPath $source -Destination (Join-Path $stage $name) -Force }
          }
          foreach ($name in @("build-metadata.json", "source-verification.txt", "package-resource-verification.txt")) {
            if (Test-Path $name) { Copy-Item -LiteralPath $name -Destination (Join-Path $stage $name) -Force }
          }
          $desktopStage = Join-Path $stage "desktop-source"
          New-Item -ItemType Directory -Path $desktopStage -Force | Out-Null
          Copy-Item -LiteralPath "desktop-source/package.json" -Destination $desktopStage -Force
          foreach ($folder in @("scripts", "lib", "app", "components", "electron", "tests", "public", "styles", "types", "pages", "src", "docs", "data/research", "data/source-manifests", "data/sql", "data/schemas")) {
            $sourceFolder = Join-Path "desktop-source" $folder
            $targetFolder = Join-Path $desktopStage $folder
            New-Item -ItemType Directory -Path $targetFolder -Force | Out-Null
            if (Test-Path $sourceFolder) { Copy-Item -Path (Join-Path $sourceFolder "*") -Destination $targetFolder -Recurse -Force }
          }
      - name: Upload desktop source audit evidence
