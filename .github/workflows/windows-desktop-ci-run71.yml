      - name: Write build metadata
        if: always()
        shell: pwsh
        run: |
          $items = @()
          $sourceLine = Get-Content -LiteralPath "source-verification.txt" -Raw -ErrorAction SilentlyContinue
          $sourceHash = if ($sourceLine -match "source_archive_sha256=([a-f0-9]{64})") { $Matches[1] } else { $null }
          $patchHash = if ($sourceLine -match "catalog_import_v2_patch_sha256=([a-f0-9]{64})") { $Matches[1] } else { $null }
          $wikidataDbHash = if ($sourceLine -match "wikidata_pack=[^\r\n]*database_sha256=([a-f0-9]{64})") { $Matches[1] } else { $null }
          $wikidataSnapshotHash = if ($sourceLine -match "wikidata_pack=[^\r\n]*snapshot_sha256=([a-f0-9]{64})") { $Matches[1] } else { $null }
          $wikidataManifestHash = if ($sourceLine -match "wikidata_pack=[^\r\n]*manifest_sha256=([a-f0-9]{64})") { $Matches[1] } else { $null }
          $wikidataArtifactHash = if ($sourceLine -match "wikidata_artifact_sha256=([a-f0-9]{64})") { $Matches[1] } else { $null }
          $wikidataSourceRevision = if ($sourceLine -match "wikidata_source_revision=([^\r\n]+)") { $Matches[1].Trim() } else { $null }
          $genericReportPath = "desktop-source/data/research/run69-integration-verification.json"
          $genericReport = if (Test-Path $genericReportPath) { Get-Content -LiteralPath $genericReportPath -Raw | ConvertFrom-Json } else { $null }
          $genericDbHash = if ($genericReport) { $genericReport.database_sha256 } else { $null }
          $genericSnapshotHash = if ($genericReport) { $genericReport.source_snapshot_sha256 } else { $null }
          $genericManifestHash = if ($genericReport) { $genericReport.source_manifest_sha256 } else { $null }
          $genericSourceRevision = if ($genericReport) { $genericReport.source_revision } else { $null }
          $genericGuidanceCount = if ($genericReport) { $genericReport.counts.generic_authored_guidance } else { $null }
          $genericDtcCount = if ($genericReport) { $genericReport.counts.generic_sae_dtc_references } else { $null }
          $generationReportPath = "desktop-source/data/research/wikidata-vag-generation-candidates-cc0/integration-verification.json"
          $generationReport = if (Test-Path $generationReportPath) { Get-Content -LiteralPath $generationReportPath -Raw | ConvertFrom-Json } else { $null }
          $generationDbHash = if ($generationReport) { $generationReport.database_sha256 } else { $null }
          $generationSnapshotHash = if ($generationReport) { $generationReport.source_snapshot_sha256 } else { $null }
          $generationQueryHash = if ($generationReport) { $generationReport.source_query_sha256 } else { $null }
          $generationManifestHash = if ($generationReport) { $generationReport.source_manifest_sha256 } else { $null }
          $generationSourceRevision = if ($generationReport) { $generationReport.source_revision } else { $null }
          $generationArtifactHash = if ($sourceLine -match "wikidata_generation_artifact_sha256=([a-f0-9]{64})") { $Matches[1] } else { $null }
          $generationMemberCount = if ($generationReport) { $generationReport.counts.member_entities } else { $null }
          $generationLinkCount = if ($generationReport) { $generationReport.counts.model_member_links } else { $null }
          $generationBindingCount = if ($generationReport) { $generationReport.counts.source_bindings } else { $null }
          $sourceRegisterPath = "desktop-source/data/source-manifests/vag-factory-source-register.json"
          $sourceRegisterJson = if (Test-Path $sourceRegisterPath) { Get-Content -LiteralPath $sourceRegisterPath -Raw | ConvertFrom-Json } else { $null }
          $sourceRegisterHash = if (Test-Path $sourceRegisterPath) { (Get-FileHash -LiteralPath $sourceRegisterPath -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null }
          $sourceRegisterCount = if ($sourceRegisterJson) { @($sourceRegisterJson.sources).Count } else { $null }
          $sourceRegisterUpdatedAt = if ($sourceRegisterJson) { $sourceRegisterJson.updated_at } else { $null }

          foreach ($file in @(
            (Join-Path $env:RUNNER_TEMP "VAG-TECH-PRO-Setup-0.2.3-x64.exe"),
            (Join-Path $env:RUNNER_TEMP "VAG-TECH-PRO-Setup-0.2.4-x64.exe")
          )) {
            if (Test-Path $file) {
              $items += [ordered]@{ name = [System.IO.Path]::GetFileName($file); bytes = (Get-Item $file).Length; sha256 = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() }
            }
          }
          [ordered]@{ source_archive_sha256 = $sourceHash; vag_source_register_sha256 = $sourceRegisterHash; vag_source_register_source_count = $sourceRegisterCount; vag_source_register_updated_at = $sourceRegisterUpdatedAt; catalog_import_v2_patch_sha256 = $patchHash; wikidata_database_sha256 = $wikidataDbHash; wikidata_snapshot_sha256 = $wikidataSnapshotHash; wikidata_manifest_sha256 = $wikidataManifestHash; wikidata_artifact_sha256 = $wikidataArtifactHash; wikidata_source_revision = $wikidataSourceRevision; wikidata_generation_database_sha256 = $generationDbHash; wikidata_generation_snapshot_sha256 = $generationSnapshotHash; wikidata_generation_query_sha256 = $generationQueryHash; wikidata_generation_manifest_sha256 = $generationManifestHash; wikidata_generation_artifact_sha256 = $generationArtifactHash; wikidata_generation_source_revision = $generationSourceRevision; wikidata_generation_member_entities = $generationMemberCount; wikidata_generation_model_member_links = $generationLinkCount; wikidata_generation_source_bindings = $generationBindingCount; generic_guidance_database_sha256 = $genericDbHash; generic_guidance_snapshot_sha256 = $genericSnapshotHash; generic_guidance_manifest_sha256 = $genericManifestHash; generic_guidance_source_revision = $genericSourceRevision; generic_guidance_rows = $genericGuidanceCount; generic_dtc_references = $genericDtcCount; desktop_version = '0.2.4'; patch_set = 'run54-local-catalog-import-v2+run68-wikidata-cc0-candidate-pack+run69-mechanicdb-generic-odbl-research-only+run70-wikidata-generation-candidates'; installers = $items; run_id = $env:GITHUB_RUN_ID; commit = $env:GITHUB_SHA } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath build-metadata.json -Encoding utf8

      - name: Stage Windows 2022 lifecycle verification payload
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:GITHUB_WORKSPACE "windows-lifecycle-staging"
          if (Test-Path $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($name in @("VAG-TECH-PRO-Setup-0.2.3-x64.exe", "VAG-TECH-PRO-Setup-0.2.4-x64.exe")) {
            $source = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $source) { Copy-Item -LiteralPath $source -Destination (Join-Path $stage $name) -Force }
          }
          foreach ($name in @("build-metadata.json", "source-verification.txt")) {
            if (Test-Path $name) { Copy-Item -LiteralPath $name -Destination (Join-Path $stage $name) -Force }
          }
          $desktopStage = Join-Path $stage "desktop-source"
          New-Item -ItemType Directory -Path $desktopStage -Force | Out-Null
          Copy-Item -LiteralPath "desktop-source/package.json" -Destination $desktopStage -Force
          foreach ($folder in @("scripts", "lib", "data/research", "data/source-manifests")) {
            $sourceFolder = Join-Path "desktop-source" $folder
            $targetFolder = Join-Path $desktopStage $folder
            New-Item -ItemType Directory -Path $targetFolder -Force | Out-Null
            if (Test-Path $sourceFolder) { Copy-Item -Path (Join-Path $sourceFolder "*") -Destination $targetFolder -Recurse -Force }
          }
      - name: Upload Windows installer and verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vag-tech-pro-windows-x64-run70
          path: |
            desktop-source/package-lock.json
            desktop-source/npm-lock.log
            desktop-source/local-core-host-origin-patch.log
            desktop-source/npm-ci.log
            desktop-source/npm-audit.log
            desktop-source/npm-audit-production.log
            desktop-source/test.log
            catalog-import-v2-tests.log
            desktop-source/verify-local-core.log
            desktop-source/verify-local-research.log
            wikidata-integration-run68.log
            generic-guidance-source-rights.log
            generic-guidance-pack-build.log
            generic-guidance-pack-tests.log
            generic-guidance-integration-run69.log
            desktop-source/data/research/run69-integration-verification.json
            desktop-source/data/research/mechanicdb-generic-repair-guidance-odbl/*
            desktop-source/data/source-manifests/mechanicdb-generic-repair-guidance.json
            desktop-source/data/source-manifests/vag-factory-source-register.json
            desktop-source/lib/generic-repair-guidance-db.cjs
            desktop-source/tests/generic-repair-guidance-db.test.cjs
            desktop-source/tests/generic-repair-guidance-ui-contract.test.cjs
            desktop-source/data/research/wikidata-vag-model-taxonomy-cc0/integration-verification.json
            desktop-source/data/research/wikidata-vag-model-taxonomy-cc0/desktop-integration-verification.json
            desktop-source/vehicle-config-match-guard-verification.json
            desktop-source/lint.log
            desktop-source/typecheck.log
            desktop-source/components/local-research-catalog.tsx
            desktop-source/app/api/local-research/route.ts
            desktop-source/lib/local-research-db.cjs
            desktop-dbrow-types-fix.log
            desktop-source/build-0.2.2.log
            desktop-source/build-0.2.3.log
            desktop-source/runtime-preparation.json
            research-hash-targeted-test.log
            windows-lifecycle.log
            windows-lifecycle-staging/**
            lifecycle-fetchmetadata-strict-fix.log
            build-metadata.json
            source-verification.txt
            vag-source-register-sync.log
            scripts/sync_vag_source_register.py
            tests/test_sync_vag_source_register_source_rights.py
          if-no-files-found: warn
          retention-days: 14

  windows-2022-lifecycle:
    name: Windows Server 2022 installer compatibility lifecycle
    needs: build-and-lifecycle
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Download installers and offline lifecycle contract
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vag-tech-pro-windows-x64-run70
          path: ${{ runner.temp }}/vag-tech-pro-run70-artifact
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node for bundled SQLite verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify installer hashes and execute Windows Server 2022 lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactRoot = Join-Path $env:RUNNER_TEMP "vag-tech-pro-run70-artifact/windows-lifecycle-staging"
          $metadata = Get-Content -LiteralPath (Join-Path $artifactRoot "build-metadata.json") -Raw | ConvertFrom-Json
          $installer = Join-Path $artifactRoot "VAG-TECH-PRO-Setup-0.2.3-x64.exe"
          $upgradeInstaller = Join-Path $artifactRoot "VAG-TECH-PRO-Setup-0.2.4-x64.exe"
          foreach ($file in @($installer, $upgradeInstaller)) {
            if (-not (Test-Path $file)) { throw "Windows installer artifact is missing: $file" }
            $name = [System.IO.Path]::GetFileName($file)
            $expected = $metadata.installers | Where-Object { $_.name -eq $name } | Select-Object -First 1
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($null -eq $expected -or $expected.sha256 -ne $actual) { throw "Windows installer artifact hash mismatch: $name" }
          }
          if ($metadata.desktop_version -ne "0.2.4" -or $metadata.wikidata_generation_member_entities -ne 9 -or $metadata.wikidata_generation_model_member_links -ne 10 -or $metadata.wikidata_generation_source_bindings -ne 14) { throw "Build metadata does not describe the pinned generation candidate pack." }
          $desktopRoot = Join-Path $artifactRoot "desktop-source"
          $sourceRegisterPath = Join-Path $desktopRoot "data/source-manifests/vag-factory-source-register.json"
          if (-not (Test-Path -LiteralPath $sourceRegisterPath -PathType Leaf)) { throw "Bundled source-rights register is missing from Windows artifact." }
          $sourceRegisterActualHash = (Get-FileHash -LiteralPath $sourceRegisterPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceRegister = Get-Content -LiteralPath $sourceRegisterPath -Raw | ConvertFrom-Json
          if ($metadata.vag_source_register_sha256 -ne $sourceRegisterActualHash -or $metadata.vag_source_register_source_count -ne @($sourceRegister.sources).Count -or $metadata.vag_source_register_updated_at -ne $sourceRegister.updated_at) { throw "Bundled source-rights register does not match build metadata." }
          $lifecycle = Join-Path $desktopRoot "scripts/windows-installer-lifecycle.ps1"
          if (-not (Test-Path $lifecycle)) { throw "Offline Windows lifecycle script was not packaged." }
          foreach ($required in @("data/research/manifest.json", "data/research/wikidata-vag-generation-candidates-cc0/manifest.json", "data/research/wikidata-vag-generation-candidates-cc0/wikidata-vag-generations.sqlite", "lib/local-research-db.cjs", "scripts/verify-local-research-packs.cjs")) {
            if (-not (Test-Path (Join-Path $desktopRoot $required))) { throw "Offline lifecycle evidence file is missing: $required" }
          }
          Set-Location $desktopRoot
          pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File $lifecycle -InstallerPath $installer -UpgradeInstallerPath $upgradeInstaller 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/windows-2022-lifecycle.log"
          if ($LASTEXITCODE -ne 0) { throw "Windows Server 2022 installer lifecycle test failed" }

      - name: Upload Windows Server 2022 lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vag-tech-pro-windows-2022-lifecycle-run70
          path: |
            ${{ runner.temp }}/vag-tech-pro-run70-artifact/windows-lifecycle-staging/build-metadata.json
            ${{ runner.temp }}/vag-tech-pro-run70-artifact/windows-lifecycle-staging/source-verification.txt
            windows-2022-lifecycle.log
          if-no-files-found: warn
          retention-days: 30

