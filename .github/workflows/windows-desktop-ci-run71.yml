          path: ${{ runner.temp }}/vag-tech-pro-astra-pack
          run-id: ${{ steps.astra-pack.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Integrate ASTRA CH pack into offline desktop research catalog
        shell: pwsh
        run: |
