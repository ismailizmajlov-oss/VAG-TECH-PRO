      - name: Apply transactional local catalog importer v2 (run54)
        working-directory: desktop-source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $encodedPath = Join-Path $env:GITHUB_WORKSPACE "catalog-import-v2-run54.patch.gz.b64"
          if (-not (Test-Path $encodedPath)) { throw "Run54 compressed catalog importer patch is missing" }
          $encoded = (Get-Content -LiteralPath $encodedPath -Raw).Trim()
          $compressedBytes = [Convert]::FromBase64String($encoded)
          $compressedSha = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($compressedBytes)).ToLowerInvariant()
          if ($compressedSha -ne "378517318d4f15a87be9eda845eb1329b8d763d766a269b44fe32ee0b1e1bca3") { throw "Run54 compressed patch SHA-256 mismatch: $compressedSha" }
          $compressedStream = [System.IO.MemoryStream]::new($compressedBytes)
          $gzipStream = [System.IO.Compression.GZipStream]::new($compressedStream,[System.IO.Compression.CompressionMode]::Decompress)
          $outputStream = [System.IO.MemoryStream]::new()
          $gzipStream.CopyTo($outputStream)
          $patchBytes = $outputStream.ToArray()
          $gzipStream.Dispose(); $compressedStream.Dispose(); $outputStream.Dispose()
          $patchHash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($patchBytes)).ToLowerInvariant()
          if ($patchHash -ne "a2955404a4dfc48352389318a1a9bca413527a4513cfc2e934f32d35bcc45b28") { throw "Run54 decompressed patch SHA-256 mismatch: $patchHash" }
          $patchPath = Join-Path $env:RUNNER_TEMP "catalog-import-v2-run54.patch"
          [System.IO.File]::WriteAllBytes($patchPath,$patchBytes)
          git apply --check $patchPath
          if ($LASTEXITCODE -ne 0) { throw "Run54 catalog importer patch check failed" }
