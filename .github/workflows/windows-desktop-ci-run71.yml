          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ($evidence.status -ne "integrated_verified_series_member_candidates_only" -or $evidence.counts.member_entities -ne 9 -or $evidence.counts.model_member_links -ne 10 -or $evidence.counts.source_bindings -ne 14 -or $evidence.market_scope -ne "UNKNOWN" -or $evidence.applicability_precision -ne "series_member_candidate" -or $evidence.generation_verified -ne $false -or $evidence.exact_vehicle_fitment -ne $false -or $evidence.diagnostic_execution_allowed -ne $false) { throw "Run70 generation evidence failed candidate-only applicability gate" }
          "wikidata_generation_pack=CC0-1.0; members=9; model_member_links=10; source_bindings=14; market=UNKNOWN; generation=unverified; exact_fitment=none; engine_gearbox_ECU_DTC_repair=none; database_sha256=$($evidence.database_sha256); snapshot_sha256=$($evidence.source_snapshot_sha256); query_sha256=$($evidence.source_query_sha256); manifest_sha256=$($evidence.source_manifest_sha256)" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8
