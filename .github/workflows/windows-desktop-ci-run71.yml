          $digest = ([string]$artifact.digest -replace "^sha256:", "").ToLowerInvariant()
          if ($artifact.id -ne [long]$artifactId -or $artifact.name -ne "ownerspecs-vag-vehicle-specs-research-pack" -or $artifact.expired -ne $false -or $digest -ne $expectedDigest) { throw "Pinned OwnerSpecs research-pack artifact ID, name, expiry or SHA-256 mismatch." }
