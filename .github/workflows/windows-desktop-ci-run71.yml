          $encoded = (($parts | ForEach-Object { (Get-Content -Raw -LiteralPath $_.FullName).Trim() }) -join "")
          if ($encoded.Length -ne 37060) { throw "Run72 patch base64 length mismatch: $($encoded.Length)" }
          $encodedHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($encoded))).ToLowerInvariant()
          if ($encodedHash -ne "21544049e839a30003dc8020ad9a0d29790fc847fd4ea8fcf7c8e56facb004e3") { throw "Run72 patch base64 SHA-256 mismatch" }
          $compressed = [Convert]::FromBase64String($encoded)
          $compressedHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($compressed)).ToLowerInvariant()
          if ($compressedHash -ne "2167630469678bdb39db964e455902d0cbcd71e25b3dde3a0f9b6178544f1c15") { throw "Run72 Brotli patch SHA-256 mismatch" }
          $inputStream = [IO.MemoryStream]::new($compressed)
          $brotli = [IO.Compression.BrotliStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress)
          $outputStream = [IO.MemoryStream]::new()
          $brotli.CopyTo($outputStream)
          $patchBytes = $outputStream.ToArray()
          $patchHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($patchBytes)).ToLowerInvariant()
          if ($patchHash -ne "c80b7dc5614e769b4485eee6a620136752284e22db9425495f4fa4b82ca5d700") { throw "Run72 decoded patch SHA-256 mismatch" }
          $patchPath = Join-Path $env:RUNNER_TEMP "vag-tech-pro-run72.patch"
          [IO.File]::WriteAllBytes($patchPath, $patchBytes)
          git apply --check --unsafe-paths --directory=desktop-source $patchPath
          if ($LASTEXITCODE -ne 0) { throw "Run72 local catalog v2 patch check failed" }
          git apply --unsafe-paths --directory=desktop-source $patchPath
          if ($LASTEXITCODE -ne 0) { throw "Run72 local catalog v2 patch application failed" }

          $patchPartsDir73 = Join-Path $env:GITHUB_WORKSPACE ".github/patches/desktop-source-run73"
          $parts73 = @(Get-ChildItem -LiteralPath $patchPartsDir73 -Filter "part-*.b64" -File | Sort-Object Name)
          if ($parts73.Count -ne 5) { throw "Expected 5 immutable run73 patch chunks, found $($parts73.Count)" }
          $encoded73 = (($parts73 | ForEach-Object { (Get-Content -Raw -LiteralPath $_.FullName).Trim() }) -join "")
          if ($encoded73.Length -ne 8024) { throw "Run73 patch base64 length mismatch: $($encoded73.Length)" }
          $encodedHash73 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($encoded73))).ToLowerInvariant()
          if ($encodedHash73 -ne "ec002ebd83aa88343f180d535c4c42a4e5fbf49243e3091fa064b478636a7599") { throw "Run73 patch base64 SHA-256 mismatch" }
          $compressed73 = [Convert]::FromBase64String($encoded73)
          $compressedHash73 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($compressed73)).ToLowerInvariant()
          if ($compressedHash73 -ne "818308fd37f5d970cac32cc2cb58ec34f03a2b03b195c0ac0a5e8e7c52e0d535") { throw "Run73 Brotli patch SHA-256 mismatch" }
          $inputStream73 = [IO.MemoryStream]::new($compressed73)
          $brotli73 = [IO.Compression.BrotliStream]::new($inputStream73, [IO.Compression.CompressionMode]::Decompress)
          $outputStream73 = [IO.MemoryStream]::new()
          $brotli73.CopyTo($outputStream73)
          $patchBytes73 = $outputStream73.ToArray()
          $patchHash73 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($patchBytes73)).ToLowerInvariant()
          if ($patchHash73 -ne "cb2824958a14dba68d8e944eb757b30b74d8dcb048cbc5abebe0caa1f5b25034") { throw "Run73 decoded patch SHA-256 mismatch" }
          $patchPath73 = Join-Path $env:RUNNER_TEMP "vag-tech-pro-run73.patch"
          [IO.File]::WriteAllBytes($patchPath73, $patchBytes73)
          git apply --check --unsafe-paths --directory=desktop-source $patchPath73
          if ($LASTEXITCODE -ne 0) { throw "Run73 share-alike and migration audit patch check failed" }
          git apply --unsafe-paths --directory=desktop-source $patchPath73
          if ($LASTEXITCODE -ne 0) { throw "Run73 share-alike and migration audit patch application failed" }

          $patchPartsDir74 = Join-Path $env:GITHUB_WORKSPACE ".github/patches/desktop-source-run74"
          $parts74 = @(Get-ChildItem -LiteralPath $patchPartsDir74 -Filter "part-*.b64" -File | Sort-Object Name)
          if ($parts74.Count -ne 1) { throw "Expected 1 immutable run74 patch chunk, found $($parts74.Count)" }
          $encoded74 = [IO.File]::ReadAllText($parts74[0].FullName).Trim()
          if ($encoded74.Length -ne 920) { throw "Run74 patch base64 length mismatch: $($encoded74.Length)" }
          $encodedHash74 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($encoded74))).ToLowerInvariant()
          if ($encodedHash74 -ne "9bb0c5c1677d60666b7c35d8bbc830646cc0e260373e4548ab11fdb56d7781f8") { throw "Run74 patch base64 SHA-256 mismatch" }
          $compressed74 = [Convert]::FromBase64String($encoded74)
          $compressedHash74 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($compressed74)).ToLowerInvariant()
          if ($compressedHash74 -ne "17a976b6e4cd0d1f58f093a51a27168d05d2c242deb9f326d4dbdace3136bbae") { throw "Run74 Brotli patch SHA-256 mismatch" }
          $inputStream74 = [IO.MemoryStream]::new($compressed74)
          $brotli74 = [IO.Compression.BrotliStream]::new($inputStream74, [IO.Compression.CompressionMode]::Decompress)
          $outputStream74 = [IO.MemoryStream]::new()
          $brotli74.CopyTo($outputStream74)
          $patchBytes74 = $outputStream74.ToArray()
          $patchHash74 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($patchBytes74)).ToLowerInvariant()
          if ($patchHash74 -ne "d2f056b3ce8ea1512a39c17cfbe23db8f2b9b660872ba42fc0b43037255d4e0f") { throw "Run74 decoded patch SHA-256 mismatch" }
          $patchPath74 = Join-Path $env:RUNNER_TEMP "vag-tech-pro-run74.patch"
          [IO.File]::WriteAllBytes($patchPath74, $patchBytes74)
          git apply --check --unsafe-paths --directory=desktop-source $patchPath74
          if ($LASTEXITCODE -ne 0) { throw "Run74 Windows line-ending migration audit patch check failed" }
          git apply --unsafe-paths --directory=desktop-source $patchPath74
          if ($LASTEXITCODE -ne 0) { throw "Run74 Windows line-ending migration audit patch application failed" }

          node --check apply-local-core-test-cleanup-run75.cjs
          if ($LASTEXITCODE -ne 0) { throw "Run75 local-core cleanup patch syntax check failed" }
          node apply-local-core-test-cleanup-run75.cjs --desktop-root desktop-source
          if ($LASTEXITCODE -ne 0) { throw "Run75 local-core test SQLite cleanup patch failed" }
          "local_core_test_fixture_handles=closed_in_finally; windows_file_lock_regression=covered" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8

          Push-Location (Join-Path $env:GITHUB_WORKSPACE "desktop-source")
          try {
            node scripts/verify-local-core.cjs | Tee-Object -FilePath "verify-local-core-v2.log"
            if ($LASTEXITCODE -ne 0) { throw "Local core v2 packaged migration verification failed" }
            node --test tests/local-core-db.test.cjs tests/local-core-api.test.cjs tests/local-data-admin-ui-contract.test.cjs | Tee-Object -FilePath "../catalog-import-v3-tests.log"
            if ($LASTEXITCODE -ne 0) { throw "Local catalog v2, rights-isolation and evidence review tests failed" }
          } finally { Pop-Location }

      - name: Resolve latest ASTRA CH TAS pack run
        id: astra-pack
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $workflowUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/workflows/acquire-astra-ch-tas-vag-probe.yml/runs?branch=main&per_page=100"
          $response = Invoke-RestMethod -Uri $workflowUri -Headers $headers -Method Get
          $run = $response.workflow_runs | Sort-Object run_number -Descending | Select-Object -First 1
          if (-not $run) { throw "No ASTRA CH TAS pack workflow run exists." }
          for ($attempt = 0; $attempt -lt 30 -and $run.status -ne "completed"; $attempt++) {
            Start-Sleep -Seconds 20
            $response = Invoke-RestMethod -Uri $workflowUri -Headers $headers -Method Get
            $run = $response.workflow_runs | Where-Object { $_.id -eq $run.id } | Select-Object -First 1
          }
          if ($run.status -ne "completed" -or $run.conclusion -ne "success") { throw "Latest ASTRA CH TAS pack run did not complete successfully; refusing stale artifact fallback." }
          $artifactsUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/artifacts"
          $artifacts = Invoke-RestMethod -Uri $artifactsUri -Headers $headers -Method Get
          $artifact = $artifacts.artifacts | Where-Object { $_.name -eq "astra-ch-tas-vag-open-data-pack" -and -not $_.expired } | Select-Object -First 1
          if (-not $artifact) { throw "Latest ASTRA run has no unexpired verified SQLite pack artifact." }
          $digest = ([string]$artifact.digest -replace "^sha256:", "").ToLowerInvariant()
          if ($digest -notmatch "^[a-f0-9]{64}$") { throw "Latest ASTRA artifact has no valid SHA-256 digest." }
          "run_id=$($run.id)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "run_number=$($run.run_number)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "artifact_sha256=$digest" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "ASTRA pack source run: #$($run.run_number) / $($run.id)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "ASTRA artifact SHA-256: $digest" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Download verified ASTRA CH TAS SQLite pack
        uses: actions/download-artifact@v4
        with:
          name: astra-ch-tas-vag-open-data-pack
          path: ${{ runner.temp }}/vag-tech-pro-astra-pack
          run-id: ${{ steps.astra-pack.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Integrate ASTRA CH pack into offline desktop research catalog
        shell: pwsh
        run: |
          $packDir = Join-Path $env:RUNNER_TEMP "vag-tech-pro-astra-pack"
          node --check scripts/integrate-astra-ch-tas-run72.cjs
          node scripts/integrate-astra-ch-tas-run72.cjs --desktop-root desktop-source --pack-dir $packDir --source-run-id "${{ steps.astra-pack.outputs.run_id }}" --artifact-sha256 "${{ steps.astra-pack.outputs.artifact_sha256 }}"
          if ($LASTEXITCODE -ne 0) { throw "ASTRA CH desktop integration failed." }
          $report = Get-Content -LiteralPath "desktop-source/data/research/astra-ch-tas-vag-open-data/desktop-integration-report.json" -Raw | ConvertFrom-Json
          if ($report.status -ne "integrated_verified_research_only" -or $report.market_scope[0] -ne "CH" -or $report.ru_eaeu_applicability -ne $false -or $report.production_import -ne $false) { throw "ASTRA desktop integration report failed its market/fitment boundary." }
          "ASTRA CH pack integrated: $($report.database_sha256)" | Add-Content -LiteralPath "desktop-source/source-verification.txt"

      - name: Mirror patched desktop source and ASTRA integration into audit staging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceAuditRoot = Join-Path $env:GITHUB_WORKSPACE "windows-lifecycle-staging/desktop-source"
          $auditFiles = @(
            "app/api/local-core/route.ts",
            "app/api/local-research/route.ts",
            "app/globals.css",
            "components/local-data-admin.tsx",
            "components/local-offline-workspace.tsx",
            "components/local-research-catalog.tsx",
            "scripts/windows-installer-lifecycle.ps1",
            "tests/astra-ch-tas-ui-contract.test.cjs",
            "data/schemas/vehicle-catalog-package.schema.json",
            "data/sql/local-core-v1.sql",
            "data/sql/local-core-v2.sql",
            "docs/LOCAL_VEHICLE_CATALOG_IMPORT.md",
            "lib/local-core-db.cjs",
            "scripts/verify-local-core.cjs",
            "tests/local-core-db.test.cjs",
            "tests/local-core-api.test.cjs",
            "tests/local-data-admin-ui-contract.test.cjs",
            "data/research/astra-ch-tas-vag-open-data/desktop-integration-report.json",
            "data/research/astra-ch-tas-vag-open-data/manifest.json"
          )
          foreach ($relative in $auditFiles) {
            $sourceFile = Join-Path (Join-Path $env:GITHUB_WORKSPACE "desktop-source") $relative
            if (Test-Path -LiteralPath $sourceFile) {
              $destinationFile = Join-Path $sourceAuditRoot $relative
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destinationFile) | Out-Null
              Copy-Item -LiteralPath $sourceFile -Destination $destinationFile -Force
            } elseif ($relative -like "data/research/astra-ch-tas-vag-open-data/*") {
              throw "Expected ASTRA audit evidence is missing: $relative"
            } else { throw "Expected source audit file is missing after patch: $relative" }
          }

      - name: Apply ASTRA CH research-pack verification (run74)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check apply-research-pack-astra-verification-run74.cjs
          if ($LASTEXITCODE -ne 0) { throw "Run74 ASTRA verifier patch syntax check failed" }
          node apply-research-pack-astra-verification-run74.cjs --desktop-root desktop-source 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/astra-research-pack-verifier-run74.log"
          if ($LASTEXITCODE -ne 0) { throw "Run74 ASTRA CH research-pack verification patch failed" }
          "research_manifest_entries=10; ASTRA_CH=verified_research_only; production_import=false; RU_EAEU_applicability=false; exact_fitment=false" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8

      - name: Repair generated desktop TypeScript contracts (run76)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check apply-desktop-types-fix-run76.cjs
          if ($LASTEXITCODE -ne 0) { throw "Run76 desktop type-fix patch syntax check failed" }
          node apply-desktop-types-fix-run76.cjs --desktop-root desktop-source 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/desktop-types-fix-run76.log"
          if ($LASTEXITCODE -ne 0) { throw "Run76 desktop TypeScript contract repair failed" }
          node --test desktop-source/tests/run76-types-fix.test.cjs 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/desktop-types-fix-run76-tests.log"
          if ($LASTEXITCODE -ne 0) { throw "Run76 generated desktop type contract test failed" }
          $sourceAuditRoot = Join-Path $env:GITHUB_WORKSPACE "windows-lifecycle-staging/desktop-source"
          foreach ($relative in @("app/api/local-research/route.ts", "components/local-data-admin.tsx", "components/local-research-catalog.tsx", "tests/run76-types-fix.test.cjs")) {
            $sourceFile = Join-Path (Join-Path $env:GITHUB_WORKSPACE "desktop-source") $relative
            $destinationFile = Join-Path $sourceAuditRoot $relative
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destinationFile) | Out-Null
            Copy-Item -LiteralPath $sourceFile -Destination $destinationFile -Force
          }
          "desktop_types_fix=run76; source_revision_state=restored; ASTRA_research_row_types=deduplicated; contract_test=passed" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8

      - name: Fix PowerShell lifecycle session output contamination (run77)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check apply-windows-lifecycle-output-fix-run77.cjs
          node apply-windows-lifecycle-output-fix-run77.cjs --desktop-root desktop-source 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/lifecycle-output-fix-run77.log"
          if ($LASTEXITCODE -ne 0) { throw "Run77 lifecycle output fix failed" }
          node --test desktop-source/tests/windows-lifecycle-script-contract.test.cjs 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/lifecycle-output-contract-run77.log"
          if ($LASTEXITCODE -ne 0) { throw "Run77 lifecycle contract tests failed" }
          $auditRoot = Join-Path $env:GITHUB_WORKSPACE "windows-lifecycle-staging/desktop-source"
          foreach ($relative in @("scripts/windows-installer-lifecycle.ps1", "tests/windows-lifecycle-script-contract.test.cjs")) {
            $sourceFile = Join-Path (Join-Path $env:GITHUB_WORKSPACE "desktop-source") $relative
            $destinationFile = Join-Path $auditRoot $relative
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destinationFile) | Out-Null
            Copy-Item -LiteralPath $sourceFile -Destination $destinationFile -Force
          }
          "lifecycle_session_output=single_session_object; BaseUrl_preserved; run77_contract=passed" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8

      - name: Enforce technical payload JSON schemas before SQLite import (run78)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check apply-technical-payload-validation-run78.cjs
          if ($LASTEXITCODE -ne 0) { throw "Run78 payload validator patcher syntax check failed" }
          node apply-technical-payload-validation-run78.cjs --desktop-root desktop-source 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/technical-payload-validation-run78.log"
          if ($LASTEXITCODE -ne 0) { throw "Run78 technical payload validation patch failed" }
          Push-Location desktop-source
          try {
            node --check lib/local-core-db.cjs
            if ($LASTEXITCODE -ne 0) { throw "Run78 local-core syntax check failed" }
            node --check electron/main.cjs
            if ($LASTEXITCODE -ne 0) { throw "Run78 Electron schema-path syntax check failed" }
            node --test tests/local-core-db.test.cjs 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/technical-payload-validation-tests-run78.log"
            if ($LASTEXITCODE -ne 0) { throw "Run78 local-core payload validation tests failed" }
          } finally { Pop-Location }
          $auditRoot = Join-Path $env:GITHUB_WORKSPACE "windows-lifecycle-staging/desktop-source"
          foreach ($relative in @("lib/local-core-db.cjs", "electron/main.cjs", "tests/local-core-db.test.cjs", "data/schemas/technical-record-payloads.schema.json")) {
            $sourceFile = Join-Path (Join-Path $env:GITHUB_WORKSPACE "desktop-source") $relative
            $destinationFile = Join-Path $auditRoot $relative
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destinationFile) | Out-Null
            Copy-Item -LiteralPath $sourceFile -Destination $destinationFile -Force
          }
          $patchHash = (Get-FileHash apply-technical-payload-validation-run78.cjs -Algorithm SHA256).Hash.ToLowerInvariant()
          "technical_payload_validation_patch_sha256=$patchHash; payload_schema_runtime_enforced=true; generic_dtc_namespace_separated=true; legacy_vag_dtc_numeric=true" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8

      - name: Run desktop, local core and research tests
        working-directory: desktop-source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm test 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { throw "Desktop test suite failed" }
          npm run verify:local-core 2>&1 | Tee-Object -FilePath verify-local-core.log
          if ($LASTEXITCODE -ne 0) { throw "Local core SQLite verification failed" }
          npm run verify:local-research 2>&1 | Tee-Object -FilePath verify-local-research.log
          if ($LASTEXITCODE -ne 0) { throw "Research pack verification failed" }

      - name: Capture generated research UI source around parser diagnostics
        if: always()
        shell: pwsh
        run: |
          $path = "desktop-source/components/local-research-catalog.tsx"
          if (Test-Path -LiteralPath $path) {
            $lines = Get-Content -LiteralPath $path
            $start = [Math]::Max(1, 300)
            $end = [Math]::Min($lines.Length, 325)
            for ($line = $start; $line -le $end; $line++) {
              Write-Host ("{0}: {1}" -f $line, $lines[$line - 1])
            }
          } else {
            Write-Host "Generated research UI source is not present."
          }

      - name: Run ESLint and TypeScript project check
        working-directory: desktop-source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run lint 2>&1 | Tee-Object -FilePath lint.log
          if ($LASTEXITCODE -ne 0) { throw "ESLint failed" }
          npm run typecheck 2>&1 | Tee-Object -FilePath typecheck.log
          if ($LASTEXITCODE -ne 0) { throw "TypeScript check failed" }

      - name: Set first desktop package version 0.2.3
        working-directory: desktop-source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); const l=JSON.parse(fs.readFileSync('package-lock.json','utf8')); p.version='0.2.3'; l.version='0.2.3'; if (l.packages && l.packages['']) l.packages[''].version='0.2.3'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)); fs.writeFileSync('package-lock.json', JSON.stringify(l,null,2));"

      - name: Build first Windows x64 NSIS installer
        working-directory: desktop-source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run build:desktop 2>&1 | Tee-Object -FilePath build-0.2.3.log
          if ($LASTEXITCODE -ne 0) { throw "Initial Windows NSIS build failed" }
          $installer = Join-Path (Get-Location) "release/VAG-TECH-PRO-Setup-0.2.3-x64.exe"
          if (-not (Test-Path $installer)) { throw "Initial NSIS installer not found: $installer" }
          foreach ($module in @("next", "react", "react-dom")) {
            $runtimeModule = Join-Path (Get-Location) ("release/win-unpacked/resources/app-runtime/node_modules/" + $module + "/package.json")
            if (-not (Test-Path $runtimeModule)) { throw "Packaged runtime dependency is missing: $module ($runtimeModule)" }
          }
          $env:VAG_TECH_PRO_RESEARCH_DIR = Join-Path (Get-Location) "release/win-unpacked/resources/research-data"
          node -e 'const s=require("./lib/local-research-db.cjs").getResearchSummary(); const p=s.packs.find(x=>x.id==="wikidata-vag-model-taxonomy-cc0"); if(!p || p.counts.models!==521 || p.counts.carModelEntities!==490 || p.counts.carModelSeriesEntities!==40 || p.counts.russianLabels!==285 || p.marketScope!=="UNKNOWN" || p.fitmentClaim!==false) throw new Error("Packaged Wikidata offline resource verification failed"); console.log(JSON.stringify(p));'
          if ($LASTEXITCODE -ne 0) { throw "Packaged Wikidata offline resource verification failed" }
          node -e 'const g=require("./lib/local-research-db.cjs").getWikidataGenerationSummary(); if(g.counts.memberEntities!==109 || g.counts.modelMemberLinks!==125 || g.counts.sourceBindings!==187 || g.marketScope!=="UNKNOWN" || g.applicabilityPrecision!=="series_member_candidate" || g.generationVerified!==false || g.exactVehicleFitment!==false || g.diagnosticExecutionAllowed!==false) throw new Error("Packaged Wikidata generation candidate boundary verification failed"); console.log(JSON.stringify(g));'
          if ($LASTEXITCODE -ne 0) { throw "Packaged Wikidata generation candidate verification failed" }
          node -e 'const g=require("./lib/generic-repair-guidance-db.cjs").getSummary(); if(g.counts.genericRepairGuidance!==275 || g.counts.genericDtcReferences!==75 || g.vagSpecific!==false || g.marketScope!=="UNKNOWN" || g.diagnosticExecutionAllowed!==false) throw new Error("Packaged generic MechanicDB offline resource verification failed"); console.log(JSON.stringify(g));'
          if ($LASTEXITCODE -ne 0) { throw "Packaged generic MechanicDB offline resource verification failed" }
          node scripts/verify-astra-ch-tas-pack.cjs
          if ($LASTEXITCODE -ne 0) { throw "Packaged ASTRA CH research pack verification failed" }
          node scripts/verify-astra-ch-tas-pack.cjs
          if ($LASTEXITCODE -ne 0) { throw "Packaged ASTRA CH research pack verification failed" }

          Remove-Item Env:VAG_TECH_PRO_RESEARCH_DIR -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath $installer -Destination (Join-Path $env:RUNNER_TEMP "VAG-TECH-PRO-Setup-0.2.3-x64.exe") -Force

      - name: Build upgrade Windows x64 NSIS installer
        working-directory: desktop-source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); const l=JSON.parse(fs.readFileSync('package-lock.json','utf8')); p.version='0.2.4'; l.version='0.2.4'; if (l.packages && l.packages['']) l.packages[''].version='0.2.4'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)); fs.writeFileSync('package-lock.json', JSON.stringify(l,null,2));"
          npm run build:desktop 2>&1 | Tee-Object -FilePath build-0.2.4.log
          if ($LASTEXITCODE -ne 0) { throw "Upgrade Windows NSIS build failed" }
