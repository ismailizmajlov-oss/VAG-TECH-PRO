          $russianManifestHash = if (Test-Path $russianManifestPath) { (Get-FileHash -LiteralPath $russianManifestPath -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null }
          $russianManifestCount = if ($russianManifestJson) { @($russianManifestJson.sources).Count } else { $null }
          $technicalLibrarySqlPath = "desktop-source/data/sql/technical-library.sql"
