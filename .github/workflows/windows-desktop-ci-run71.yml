            "data/research/astra-ch-tas-vag-open-data/desktop-integration-report.json",
            "data/research/astra-ch-tas-vag-open-data/manifest.json"
          )
          foreach ($relative in $auditFiles) {
            $sourceFile = Join-Path (Join-Path $env:GITHUB_WORKSPACE "desktop-source") $relative
            if (Test-Path -LiteralPath $sourceFile) {
              $destinationFile = Join-Path $sourceAuditRoot $relative
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destinationFile) | Out-Null
              Copy-Item -LiteralPath $sourceFile -Destination $destinationFile -Force
            } elseif ($relative -like "data/research/astra-ch-tas-vag-open-data/*") {
              throw "Expected ASTRA audit evidence is missing: $relative"
            } else { throw "Expected source audit file is missing after patch: $relative" }
