          if (-not $artifact) { throw "Latest RDW run has no unexpired verified research pack artifact." }
          $digest = ([string]$artifact.digest -replace "^sha256:", "").ToLowerInvariant()
          if ($digest -notmatch "^[a-f0-9]{64}$") { throw "Latest RDW artifact has no valid SHA-256 digest." }
          "run_id=$($run.id)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
