      - name: Verify packaged source manifests and technical library schemas
        working-directory: desktop-source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resources = Join-Path (Get-Location) "release/win-unpacked/resources"
          $manifestDir = Join-Path $resources "source-manifests"
          $indexPath = Join-Path $manifestDir "source-manifest-index.json"
          if (-not (Test-Path -LiteralPath $indexPath -PathType Leaf)) { throw "Packaged source-manifest index is missing." }
          $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
          if ($index.schema_version -ne 1 -or @($index.files).Count -lt 2) { throw "Packaged source-manifest index schema/count is invalid." }
          foreach ($item in $index.files) {
            if ($item.name -match '[/\\]' -or $item.name -in @(".", "..")) { throw "Unsafe source-manifest filename in index: $($item.name)" }
            $path = Join-Path $manifestDir $item.name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Packaged source manifest is missing: $($item.name)" }
            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $actualBytes = (Get-Item -LiteralPath $path).Length
            if ($actualHash -ne $item.sha256 -or $actualBytes -ne $item.bytes) { throw "Packaged source manifest hash/size mismatch: $($item.name)" }
          }
          $russianPath = Join-Path $manifestDir "russian-eaeu-otts-sources.json"
          $russian = Get-Content -LiteralPath $russianPath -Raw | ConvertFrom-Json
          if (@($russian.sources | Where-Object { $_.data_ingested -eq $true }).Count -gt 0) { throw "Packaged Russian/EEU OTTS manifest contains an unlicensed ingested source." }

          $sqlFiles = @(
            @{ name="vehicle-catalog.sql"; source=(Join-Path (Get-Location) "data/sql/vehicle-catalog.sql"); packaged=(Join-Path $resources "sql-schema/vehicle-catalog.sql"); key="vehicle_catalog_sql_sha256" }
            @{ name="oem-dtc-index.sql"; source=(Join-Path (Get-Location) "data/sql/oem-dtc-index.sql"); packaged=(Join-Path $resources "sql-schema/oem-dtc-index.sql"); key="oem_dtc_index_sql_sha256" }
            @{ name="dtc-catalog-links.sql"; source=(Join-Path (Get-Location) "data/sql/dtc-catalog-links.sql"); packaged=(Join-Path $resources "sql-schema/dtc-catalog-links.sql"); key="dtc_catalog_links_sql_sha256" }
            @{ name="technical-library.sql"; source=(Join-Path (Get-Location) "data/sql/technical-library.sql"); packaged=(Join-Path $resources "sql-schema/technical-library.sql"); key="technical_library_sql_sha256" }
          )
          $sqlVerificationLines = @()
          foreach ($file in $sqlFiles) {
            foreach ($path in @($file.source,$file.packaged)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "SQL schema resource is missing: $path" }
            }
            $sourceHash = (Get-FileHash -LiteralPath $file.source -Algorithm SHA256).Hash.ToLowerInvariant()
            $packagedHash = (Get-FileHash -LiteralPath $file.packaged -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sourceHash -ne $packagedHash) { throw "Packaged SQL schema differs from source: $($file.name)" }
            $sqlVerificationLines += "$($file.key)=$packagedHash"
          }
          $schemaSource = Join-Path (Get-Location) "data/schemas/technical-record-payloads.schema.json"
          $schemaPackaged = Join-Path $resources "schemas/technical-record-payloads.schema.json"
          foreach ($path in @($schemaSource,$schemaPackaged)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Technical payload schema resource is missing: $path" }
          }
          $schemaSourceHash = (Get-FileHash -LiteralPath $schemaSource -Algorithm SHA256).Hash.ToLowerInvariant()
          $schemaPackagedHash = (Get-FileHash -LiteralPath $schemaPackaged -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($schemaSourceHash -ne $schemaPackagedHash) { throw "Packaged technical payload schema differs from the source file." }
          if (@($index.files | Where-Object { $_.name -eq "cardir-vag-owner-manual-facts-cc-by-4.0.json" }).Count -ne 1) { throw "Packaged CarDir source manifest is missing from the immutable source-manifest index." }
          $env:VAG_TECH_PRO_RESEARCH_DIR = Join-Path $resources "research-data"
          $cardirSummaryJson = node -e 'const g=require("./lib/cardir-vag-reference-facts-db.cjs").getCardirSummary(); if(g.counts.sourceRows!==44272 || g.counts.vagFacts!==948 || g.counts.vagBrands!==5 || g.counts.vagModels!==26 || g.counts.parameterKeys!==19 || g.marketScope!=="UNKNOWN" || g.productionImport!==false || g.productImportAllowed!==false || g.ruEaeuApplicability!==false || g.exactEngineGearboxPair!==false || g.exactVehicleFitment!==false || g.repairProcedure!==false) throw new Error("Packaged CarDir resource failed research-only verification"); process.stdout.write(JSON.stringify(g));'
          if ($LASTEXITCODE -ne 0) { throw "Packaged CarDir resource verification failed." }
          $cardirSummary = $cardirSummaryJson | ConvertFrom-Json
          Remove-Item Env:VAG_TECH_PRO_RESEARCH_DIR -ErrorAction SilentlyContinue
          $indexHash = (Get-FileHash -LiteralPath $indexPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $russianHash = (Get-FileHash -LiteralPath $russianPath -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "source_manifest_index_sha256=$indexHash"
            "source_manifest_count=$(@($index.files).Count)"
            "russian_eaeu_otts_manifest_sha256=$russianHash"
            "russian_eaeu_otts_source_count=$(@($russian.sources).Count)"
            $sqlVerificationLines
            "cardir_database_sha256=$($cardirSummary.databaseSha256)"
            "cardir_source_snapshot_sha256=$($cardirSummary.sourceSnapshotSha256)"
            "cardir_source_manifest_sha256=$($cardirSummary.sourceManifestSha256)"
            "cardir_vag_fact_count=$($cardirSummary.counts.vagFacts)"
            "cardir_vag_model_count=$($cardirSummary.counts.vagModels)"
            "cardir_vag_brand_count=$($cardirSummary.counts.vagBrands)"
            "cardir_parameter_key_count=$($cardirSummary.counts.parameterKeys)"
            "technical_payload_schema_sha256=$schemaPackagedHash"
          ) | Out-File -FilePath "$env:GITHUB_WORKSPACE/package-resource-verification.txt" -Encoding utf8

      - name: Run clean install, offline, backup/restore, upgrade and uninstall lifecycle
        shell: pwsh
        run: |
