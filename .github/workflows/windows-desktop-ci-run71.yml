          }
          $env:VAG_TECH_PRO_RESEARCH_DIR = Join-Path (Get-Location) "release/win-unpacked/resources/research-data"
          node -e 'const s=require("./lib/local-research-db.cjs").getResearchSummary(); const p=s.packs.find(x=>x.id==="wikidata-vag-model-taxonomy-cc0"); if(!p || p.counts.models!==376 || p.counts.russianLabels!==171 || p.marketScope!=="UNKNOWN" || p.fitmentClaim!==false) throw new Error("Packaged Wikidata offline resource verification failed"); console.log(JSON.stringify(p));'
