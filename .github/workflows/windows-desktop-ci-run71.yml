permissions:
  contents: read
  actions: read

concurrency:
  group: vag-tech-pro-windows-x64-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lifecycle:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CI: "true"
    steps:
      - name: Checkout build manifest and source payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22 x64
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Setup Python 3.12 x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Validate offline data-pack tooling and rights boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python --version
          python tests/test_windows_desktop_workflow_contract.py
          python tests/test_source_manifest_bundle.py -v
          python tests/test_technical_library_schema.py -v
          python tests/test_dtc_namespace_policy.py -v
          if ($LASTEXITCODE -ne 0) { throw "Canonical DTC namespace policy cross-layer tests failed." }
          python scripts/validate-oem-dtc-index.py
          if ($LASTEXITCODE -ne 0) { throw "OEM DTC SQLite/schema namespace validation failed." }
          node --test tests/dtc-overlap-audit.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "DTC namespace overlap audit tests failed." }
          python -m py_compile scripts/vag_identity_vehiclesdb_common.py scripts/build_vag_identity_vehiclesdb.py scripts/verify_vag_identity_vehiclesdb.py scripts/test_vag_identity_vehiclesdb.py scripts/build_offline_data_pack_index.py scripts/verify_offline_data_pack_index.py
          python scripts/test_vag_identity_vehiclesdb.py
          python tests/test_offline_data_pack_rights.py
          if ($LASTEXITCODE -ne 0) { throw "Offline data-pack rights tests failed." }
          python -m py_compile scripts/build_eea_vag_approval_research_pack.py
          if ($LASTEXITCODE -ne 0) { throw "EEA research pack builder syntax check failed." }
          python -m unittest discover -s tests -p "test_eea_vag_approval_research_pack.py" -v
