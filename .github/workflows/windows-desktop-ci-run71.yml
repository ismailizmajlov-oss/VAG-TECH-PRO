          if (-not $pkg.scripts.'test:desktop'.Contains("windows-offline-firewall-contract.test.cjs")) { throw "Offline firewall contract test is not included in the desktop test script" }
          "offline_firewall_patch=applied; contract_test=registered; external_ipv4_ipv6_blocked; loopback_preserved" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8
