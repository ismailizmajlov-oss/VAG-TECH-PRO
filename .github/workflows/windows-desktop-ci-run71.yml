          $hashPath = Join-Path $env:GITHUB_WORKSPACE "apply-exact-vehicle-config-match-run64.sha256"
          $expected = (Get-Content -LiteralPath $hashPath -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Vehicle configuration guard patch SHA-256 mismatch: expected $expected actual $actual" }
          $compressed = [Convert]::FromBase64String((Get-Content -LiteralPath $patchPath -Raw).Trim())
          $gzipPath = Join-Path $env:GITHUB_WORKSPACE "apply-exact-vehicle-config-match-run64.py.gz"
          [System.IO.File]::WriteAllBytes($gzipPath, $compressed)
          py -3 -c "import gzip,pathlib; p=pathlib.Path(r'$gzipPath'); p.with_suffix('').write_bytes(gzip.decompress(p.read_bytes()))"
