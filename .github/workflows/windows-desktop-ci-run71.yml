  windows-2022-lifecycle:
    name: Windows Server 2022 installer compatibility lifecycle
    needs: build-and-lifecycle
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Download installers and offline lifecycle contract
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vag-tech-pro-windows-x64-run71
          path: ${{ runner.temp }}/vag-tech-pro-run71-artifact
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node for bundled SQLite verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify installer hashes and execute Windows Server 2022 lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactRoot = Join-Path $env:RUNNER_TEMP "vag-tech-pro-run71-artifact/windows-lifecycle-staging"
          $metadata = Get-Content -LiteralPath (Join-Path $artifactRoot "build-metadata.json") -Raw | ConvertFrom-Json
          $installer = Join-Path $artifactRoot "VAG-TECH-PRO-Setup-0.2.3-x64.exe"
          $upgradeInstaller = Join-Path $artifactRoot "VAG-TECH-PRO-Setup-0.2.4-x64.exe"
          foreach ($file in @($installer, $upgradeInstaller)) {
            if (-not (Test-Path $file)) { throw "Windows installer artifact is missing: $file" }
            $name = [System.IO.Path]::GetFileName($file)
            $expected = $metadata.installers | Where-Object { $_.name -eq $name } | Select-Object -First 1
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($null -eq $expected -or $expected.sha256 -ne $actual) { throw "Windows installer artifact hash mismatch: $name" }
          }
          if ($metadata.desktop_version -ne "0.2.4" -or $metadata.wikidata_generation_member_entities -ne 109 -or $metadata.wikidata_generation_model_member_links -ne 125 -or $metadata.wikidata_generation_source_bindings -ne 187) { throw "Build metadata does not describe the pinned generation candidate pack." }
          $desktopRoot = Join-Path $artifactRoot "desktop-source"
          $sourceRegisterPath = Join-Path $desktopRoot "data/source-manifests/vag-factory-source-register.json"
          if (-not (Test-Path -LiteralPath $sourceRegisterPath -PathType Leaf)) { throw "Bundled source-rights register is missing from Windows artifact." }
          $sourceRegisterActualHash = (Get-FileHash -LiteralPath $sourceRegisterPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceRegister = Get-Content -LiteralPath $sourceRegisterPath -Raw | ConvertFrom-Json -AsHashtable
          if ($metadata.vag_source_register_sha256 -ne $sourceRegisterActualHash -or $metadata.vag_source_register_source_count -ne @($sourceRegister.sources).Count -or $metadata.vag_source_register_updated_at -ne $sourceRegister.updated_at) { throw "Bundled source-rights register does not match build metadata." }
          $manifestDir = Join-Path $desktopRoot "data/source-manifests"
          $manifestIndexPath = Join-Path $manifestDir "source-manifest-index.json"
          if (-not (Test-Path -LiteralPath $manifestIndexPath -PathType Leaf)) { throw "Source-manifest index is missing from Windows lifecycle payload." }
          $manifestIndexHash = (Get-FileHash -LiteralPath $manifestIndexPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestIndex = Get-Content -LiteralPath $manifestIndexPath -Raw | ConvertFrom-Json
          if ($metadata.source_manifest_index_sha256 -ne $manifestIndexHash -or $metadata.source_manifest_count -ne @($manifestIndex.files).Count) { throw "Source-manifest index does not match build metadata." }
          foreach ($item in $manifestIndex.files) {
            if ($item.name -match '[/\\]' -or $item.name -in @(".", "..")) { throw "Unsafe source manifest filename: $($item.name)" }
            $manifestPath = Join-Path $manifestDir $item.name
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw "Indexed source manifest is missing: $($item.name)" }
            if ((Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item.sha256 -or (Get-Item -LiteralPath $manifestPath).Length -ne $item.bytes) { throw "Indexed source manifest hash/size mismatch: $($item.name)" }
          }
          $russianPath = Join-Path $manifestDir "russian-eaeu-otts-sources.json"
          $russianHash = (Get-FileHash -LiteralPath $russianPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $russianManifest = Get-Content -LiteralPath $russianPath -Raw | ConvertFrom-Json
          if ($metadata.russian_eaeu_otts_manifest_sha256 -ne $russianHash -or $metadata.russian_eaeu_otts_source_count -ne @($russianManifest.sources).Count) { throw "Russian/EEU OTTS manifest does not match build metadata." }
          if (@($russianManifest.sources | Where-Object { $_.data_ingested -eq $true }).Count -gt 0) { throw "Russian/EEU manifest contains a source marked ingested without cleared rights." }
          $sqlFiles = @(
            @{ path=(Join-Path $desktopRoot "data/sql/vehicle-catalog.sql"); hash=$metadata.vehicle_catalog_sql_sha256 }
            @{ path=(Join-Path $desktopRoot "data/sql/oem-dtc-index.sql"); hash=$metadata.oem_dtc_index_sql_sha256 }
            @{ path=(Join-Path $desktopRoot "data/sql/dtc-catalog-links.sql"); hash=$metadata.dtc_catalog_links_sql_sha256 }
            @{ path=(Join-Path $desktopRoot "data/sql/technical-library.sql"); hash=$metadata.technical_library_sql_sha256 }
          )
          foreach ($file in $sqlFiles) {
            if (-not (Test-Path -LiteralPath $file.path -PathType Leaf)) { throw "SQL schema file is missing from Windows lifecycle payload: $($file.path)" }
            if ((Get-FileHash -LiteralPath $file.path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.hash) { throw "SQL schema hash differs from build metadata: $($file.path)" }
          }
          $technicalSchemaPath = Join-Path $desktopRoot "data/schemas/technical-record-payloads.schema.json"
          if (-not (Test-Path -LiteralPath $technicalSchemaPath -PathType Leaf)) { throw "Technical payload schema is missing from Windows lifecycle payload." }
          if ((Get-FileHash -LiteralPath $technicalSchemaPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $metadata.technical_payload_schema_sha256) { throw "Technical payload schema hash differs from build metadata." }
          $oemDtcSchemaPath = Join-Path $desktopRoot "data/schemas/oem-dtc-index.schema.json"
          if (-not (Test-Path -LiteralPath $oemDtcSchemaPath -PathType Leaf)) { throw "OEM DTC index schema is missing from Windows lifecycle payload." }
          if ((Get-FileHash -LiteralPath $oemDtcSchemaPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $metadata.oem_dtc_index_schema_sha256) { throw "OEM DTC index schema hash differs from build metadata." }
          $lifecycle = Join-Path $desktopRoot "scripts/windows-installer-lifecycle.ps1"
          if (-not (Test-Path $lifecycle)) { throw "Offline Windows lifecycle script was not packaged." }
          $researchManifestPath = Join-Path $desktopRoot "data/research/manifest.json"
          $researchManifest = Get-Content -LiteralPath $researchManifestPath -Raw | ConvertFrom-Json
          $kbaEntry = @($researchManifest.packs | Where-Object { $_.id -eq "kba-de-vag-stock-research" }) | Select-Object -First 1
          if (-not $kbaEntry -or $kbaEntry.market_scope[0] -ne "DE" -or $kbaEntry.product_import_allowed -ne $false -or $kbaEntry.exact_engine_gearbox_pair -ne $false -or $kbaEntry.ru_eaeu_applicability -ne $false) { throw "Packaged KBA entry is missing or crossed its DE-only research boundary." }
          $kbaResearchRoot = Join-Path $desktopRoot "data/research"
          $kbaFiles = @(
            @{ path=(Join-Path $kbaResearchRoot $kbaEntry.database); hash=$kbaEntry.database_sha256 }
            @{ path=(Join-Path $kbaResearchRoot $kbaEntry.pack_manifest_file); hash=$kbaEntry.pack_manifest_sha256 }
            @{ path=(Join-Path $kbaResearchRoot $kbaEntry.source_manifest_file); hash=$kbaEntry.source_manifest_sha256 }
            @{ path=(Join-Path $kbaResearchRoot $kbaEntry.attribution_file); hash=$kbaEntry.attribution_sha256 }
            @{ path=(Join-Path $kbaResearchRoot $kbaEntry.license_file); hash=$kbaEntry.license_sha256 }
            @{ path=(Join-Path $kbaResearchRoot $kbaEntry.build_report_file); hash=$kbaEntry.build_report_sha256 }
            @{ path=(Join-Path $kbaResearchRoot $kbaEntry.desktop_integration_report_file); hash=$kbaEntry.desktop_integration_report_sha256 }
          )
          foreach ($file in $kbaFiles) {
            if (-not (Test-Path -LiteralPath $file.path -PathType Leaf)) { throw "Packaged KBA research resource is missing: $($file.path)" }
            if ((Get-FileHash -LiteralPath $file.path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.hash) { throw "Packaged KBA research resource SHA-256 mismatch: $($file.path)" }
          }
          $kbaPackManifest = Get-Content -LiteralPath (Join-Path $kbaResearchRoot $kbaEntry.pack_manifest_file) -Raw | ConvertFrom-Json
          $kbaSourceManifest = Get-Content -LiteralPath (Join-Path $kbaResearchRoot $kbaEntry.source_manifest_file) -Raw | ConvertFrom-Json
          if ($kbaPackManifest.source_snapshot_sha256 -ne $kbaEntry.source_snapshot_sha256 -or $kbaSourceManifest.snapshot.source_snapshot_sha256 -ne $kbaEntry.source_snapshot_sha256 -or $kbaPackManifest.database.sha256 -ne $kbaEntry.database_sha256) { throw "Packaged KBA source/DB provenance chain mismatch." }
          $ownerEntry = @($researchManifest.packs | Where-Object { $_.id -eq "ownerspecs-vag-vehicle-specs-research" }) | Select-Object -First 1
          if (-not $ownerEntry -or $ownerEntry.license -ne "CC BY-SA 4.0" -or $ownerEntry.market_scope[0] -ne "UNKNOWN" -or $ownerEntry.product_import_allowed -ne $false -or $ownerEntry.critical_technical_values_publishable -ne $false -or $ownerEntry.exact_engine_gearbox_pair -ne $false -or $ownerEntry.ru_eaeu_applicability -ne $false -or $ownerEntry.share_alike_required -ne $true -or $ownerEntry.separate_pack_required -ne $true) { throw "Packaged OwnerSpecs entry is missing or crossed its CC BY-SA research-only boundary." }
          if ($metadata.ownerspecs_vag_generation_count -ne 20 -or $metadata.ownerspecs_vag_fact_count -ne 233 -or $metadata.ownerspecs_database_sha256 -ne $ownerEntry.database_sha256 -or $metadata.ownerspecs_source_snapshot_sha256 -ne $ownerEntry.source_snapshot_sha256 -or $metadata.ownerspecs_source_manifest_sha256 -ne $ownerEntry.source_manifest_sha256 -or $metadata.ownerspecs_artifact_sha256 -ne $ownerEntry.source_artifact_sha256) { throw "OwnerSpecs research pack does not match standalone build metadata." }
          $ownerResearchRoot = Join-Path $desktopRoot "data/research"
          $ownerFiles = @(
            @{ path=(Join-Path $ownerResearchRoot $ownerEntry.database); hash=$ownerEntry.database_sha256 }
            @{ path=(Join-Path $ownerResearchRoot $ownerEntry.pack_manifest_file); hash=$ownerEntry.pack_manifest_sha256 }
            @{ path=(Join-Path $ownerResearchRoot $ownerEntry.source_manifest_file); hash=$ownerEntry.source_manifest_sha256 }
            @{ path=(Join-Path $ownerResearchRoot $ownerEntry.source_file); hash=$ownerEntry.source_file_sha256 }
            @{ path=(Join-Path $ownerResearchRoot $ownerEntry.source_snapshot_file); hash=$ownerEntry.source_snapshot_sha256 }
            @{ path=(Join-Path $ownerResearchRoot $ownerEntry.acquisition_snapshot_file); hash=$ownerEntry.acquisition_snapshot_sha256 }
            @{ path=(Join-Path $ownerResearchRoot $ownerEntry.attribution_file); hash=$ownerEntry.attribution_sha256 }
            @{ path=(Join-Path $ownerResearchRoot $ownerEntry.license_file); hash=$ownerEntry.license_sha256 }
            @{ path=(Join-Path $ownerResearchRoot $ownerEntry.desktop_integration_report_file); hash=$ownerEntry.desktop_integration_report_sha256 }
          )
          foreach ($file in $ownerFiles) {
            if (-not (Test-Path -LiteralPath $file.path -PathType Leaf)) { throw "Packaged OwnerSpecs research resource is missing: $($file.path)" }
            if ((Get-FileHash -LiteralPath $file.path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.hash) { throw "Packaged OwnerSpecs research resource SHA-256 mismatch: $($file.path)" }
          }
          $ownerPackManifest = Get-Content -LiteralPath (Join-Path $ownerResearchRoot $ownerEntry.pack_manifest_file) -Raw | ConvertFrom-Json
          $ownerSourceManifest = Get-Content -LiteralPath (Join-Path $ownerResearchRoot $ownerEntry.source_manifest_file) -Raw | ConvertFrom-Json
          if ($ownerPackManifest.source_snapshot_sha256 -ne $ownerEntry.source_snapshot_sha256 -or $ownerSourceManifest.snapshot.source_snapshot_sha256 -ne $ownerEntry.source_snapshot_sha256 -or $ownerPackManifest.database.sha256 -ne $ownerEntry.database_sha256 -or $ownerPackManifest.critical_technical_values_publishable -ne $false -or $ownerSourceManifest.applicability_policy.ru_eaeu_applicability -ne $false) { throw "Packaged OwnerSpecs source/DB provenance chain or applicability boundary mismatch." }
          foreach ($required in @("data/research/manifest.json", "data/research/ownerspecs-vag-vehicle-specs-research/manifest.json", "data/research/ownerspecs-vag-vehicle-specs-research/ownerspecs-vag-research.sqlite", "data/research/ownerspecs-vag-vehicle-specs-research/source-manifest.json", "data/research/ownerspecs-vag-vehicle-specs-research/source.json", "data/research/ownerspecs-vag-vehicle-specs-research/source-snapshot.json", "data/research/ownerspecs-vag-vehicle-specs-research/acquisition-snapshot.json", "data/research/ownerspecs-vag-vehicle-specs-research/LICENSE-REFERENCE.txt", "data/research/ownerspecs-vag-vehicle-specs-research/ATTRIBUTION.md", "data/research/ownerspecs-vag-vehicle-specs-research/desktop-integration-report.json", "lib/ownerspecs-vag-research-db.cjs", "scripts/verify-ownerspecs-vag-research-pack.cjs", "data/research/kba-de-vag-stock-research/manifest.json", "data/research/kba-de-vag-stock-research/kba-de-vag-stock-research.sqlite", "data/research/kba-de-vag-stock-research/source-manifest.json", "data/research/kba-de-vag-stock-research/LICENSE.txt", "data/research/kba-de-vag-stock-research/ATTRIBUTION.md", "data/research/kba-de-vag-stock-research/desktop-integration-report.json", "lib/kba-de-stock-research-db.cjs", "scripts/verify-kba-de-stock-research-pack.cjs", "data/source-manifests/source-manifest-index.json", "data/source-manifests/russian-eaeu-otts-sources.json", "data/sql/technical-library.sql", "data/schemas/technical-record-payloads.schema.json", "data/schemas/oem-dtc-index.schema.json", "data/research/wikidata-vag-generation-candidates-cc0/manifest.json", "data/research/wikidata-vag-generation-candidates-cc0/wikidata-vag-generations.sqlite", "lib/local-research-db.cjs", "scripts/verify-local-research-packs.cjs")) {
            if (-not (Test-Path (Join-Path $desktopRoot $required))) { throw "Offline lifecycle evidence file is missing: $required" }
          }
          Set-Location $desktopRoot
          pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File $lifecycle -InstallerPath $installer -UpgradeInstallerPath $upgradeInstaller 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/windows-2022-lifecycle.log"
          if ($LASTEXITCODE -ne 0) { throw "Windows Server 2022 installer lifecycle test failed" }

      - name: Upload Windows Server 2022 lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vag-tech-pro-windows-2022-lifecycle-run71
          path: |
            ${{ runner.temp }}/vag-tech-pro-run71-artifact/windows-lifecycle-staging/build-metadata.json
            ${{ runner.temp }}/vag-tech-pro-run71-artifact/windows-lifecycle-staging/source-verification.txt
            windows-2022-lifecycle.log
          if-no-files-found: warn
          retention-days: 30

