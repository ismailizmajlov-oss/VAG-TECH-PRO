          $runId = [string]$entry.research_pack_workflow_run_id
          $expectedRun = [string]$entry.research_pack_source_commit
          $artifactId = [string]$entry.research_pack_artifact_id
          $expectedDigest = ([string]$entry.research_pack_artifact_sha256).ToLowerInvariant()
          if ($runId -ne "42736946351" -or $expectedRun -ne "a1c91b0c6039640be63996571dc0607a33d64948" -or $artifactId -ne "13727965683" -or $expectedDigest -ne "3ac33a190f4621dc1b6fc69f59c90425001fd171b335c10e48268ecd62eaa82f") { throw "OwnerSpecs artifact pins differ from the reviewed source register." }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $run = Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$runId" -Headers $headers -Method Get -TimeoutSec 30
          if ($run.status -ne "completed" -or $run.conclusion -ne "success" -or $run.head_sha -ne $expectedRun -or $run.run_number -ne 31) { throw "Pinned OwnerSpecs research-pack workflow run is not the reviewed successful source revision." }
