      - name: Apply ASTRA CH research-pack verification (run74)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check apply-research-pack-astra-verification-run74.cjs
          if ($LASTEXITCODE -ne 0) { throw "Run74 ASTRA verifier patch syntax check failed" }
          node apply-research-pack-astra-verification-run74.cjs --desktop-root desktop-source 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/astra-research-pack-verifier-run74.log"
          if ($LASTEXITCODE -ne 0) { throw "Run74 ASTRA CH research-pack verification patch failed" }
          $researchManifestPath = "desktop-source/data/research/manifest.json"
          if (-not (Test-Path -LiteralPath $researchManifestPath -PathType Leaf)) { throw "Current desktop research manifest is missing after pack synchronization." }
          $researchManifest = Get-Content -LiteralPath $researchManifestPath -Raw | ConvertFrom-Json
          $researchPackIds = @($researchManifest.packs | ForEach-Object { [string]$_.id })
          $uniqueResearchPackIds = @($researchPackIds | Sort-Object -Unique)
          if ($researchPackIds.Count -lt 1 -or $researchPackIds.Count -ne $uniqueResearchPackIds.Count) { throw "Research manifest pack IDs are empty or duplicated." }
          $researchManifestEntries = $researchPackIds.Count
          $researchManifestSha = (Get-FileHash -LiteralPath $researchManifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "research_manifest_entries=$researchManifestEntries; research_manifest_sha256=$researchManifestSha; ASTRA_CH=verified_research_only; production_import=false; RU_EAEU_applicability=false; exact_fitment=false" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8

