      - name: Generate, pin and install the Windows dependency lock
        working-directory: desktop-source
        timeout-minutes: 15
        env:
          npm_config_fetch_timeout: 120000
          npm_config_fetch_retries: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --version
          npm --version
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.overrides={...(p.overrides||{}),'caniuse-lite':'1.0.30001822','minimatch@^10.0.0':'11.0.1','electron-to-chromium':'1.5.478','@electron/universal':{...((p.overrides||{})['@electron/universal']||{}),'minimatch':'11.0.1'}}; fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          "dependency_override=caniuse-lite@1.0.30001822" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund 2>&1 | Tee-Object -FilePath npm-lock.log
          if ($LASTEXITCODE -ne 0) { throw "package-lock generation failed" }
          if (-not (Test-Path package-lock.json)) { throw "package-lock.json was not generated" }
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package-lock.json','utf8'));const rows=Object.entries(p.packages||{}).filter(([k])=>k==='node_modules/minimatch'||k.endsWith('/node_modules/minimatch')).map(([path,v])=>({path,version:v.version}));const cmp=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)-(y[i]||0)}return 0};const bad=rows.filter(x=>cmp(x.version,'7.0.0')>=0&&cmp(x.version,'11.0.1')<0);if(!rows.length||bad.length)throw new Error('Vulnerable minimatch lock entries remain: '+JSON.stringify(bad.length?bad:rows));console.log(JSON.stringify({status:'patched',versions:rows}));" 2>&1 | Tee-Object -FilePath minimatch-verification.log
          if ($LASTEXITCODE -ne 0) { throw "Vulnerable minimatch versions remain in the dependency lock" }
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package-lock.json','utf8'));const rows=Object.entries(p.packages||{}).filter(([k,v])=>v.dependencies?.minimatch||v.optionalDependencies?.minimatch||v.peerDependencies?.minimatch).map(([path,v])=>({path,version:v.version,dependency:v.dependencies?.minimatch||null,optional:v.optionalDependencies?.minimatch||null,peer:v.peerDependencies?.minimatch||null}));console.log('minimatch_parent_requests='+JSON.stringify(rows));" 2>&1 | Tee-Object -FilePath minimatch-parent-requests.log
          $expectedLockHash = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "desktop-package-lock.sha256") -Raw).Trim().Split(" ")[0].ToLowerInvariant()
          $actualLockHash = (Get-FileHash -LiteralPath "package-lock.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualLockHash -ne $expectedLockHash) { throw "Dependency lock SHA-256 drift: expected $expectedLockHash actual $actualLockHash" }
          "package_lock_sha256=$actualLockHash" | Out-File -FilePath "$env:GITHUB_WORKSPACE/source-verification.txt" -Append -Encoding utf8
          if (Test-Path node_modules) { Remove-Item -LiteralPath node_modules -Recurse -Force }
          npm install --no-save --no-audit --no-fund 2>&1 | Tee-Object -FilePath npm-install.log
          if ($LASTEXITCODE -ne 0) { throw "Clean npm install failed" }
          $installedLockHash = (Get-FileHash -LiteralPath "package-lock.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installedLockHash -ne $expectedLockHash) { throw "Dependency lock changed during clean installation: expected $expectedLockHash actual $installedLockHash" }
          node -e "const fs=require('node:fs'),path=require('node:path');const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));const rows=Object.entries(lock.packages||{}).filter(([k])=>k==='node_modules/minimatch'||k.endsWith('/node_modules/minimatch'));const cmp=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)-(y[i]||0)}return 0};for(const [entry,v] of rows){const pkgPath=path.join(process.cwd(),entry,'package.json');if(!fs.existsSync(pkgPath))throw new Error('Installed minimatch package missing: '+entry);const actual=JSON.parse(fs.readFileSync(pkgPath,'utf8')).version;if(actual!==v.version)throw new Error('Installed minimatch differs from lock: '+entry+' '+actual+' != '+v.version);if(cmp(actual,'7.0.0')>=0&&cmp(actual,'11.0.1')<0)throw new Error('Vulnerable installed minimatch: '+entry+' '+actual)}if(!rows.length)throw new Error('No minimatch lock entries');console.log(JSON.stringify({status:'installed-tree-matches-lock',count:rows.length,versions:rows.map(([entry,v])=>({path:entry,version:v.version}))}));" 2>&1 | Tee-Object -FilePath installed-dependency-verification.log
          if ($LASTEXITCODE -ne 0) { throw "Installed dependency tree does not match the pinned, patched lock" }
          npm audit --omit=dev --audit-level=moderate 2>&1 | Tee-Object -FilePath npm-audit-production.log
          if ($LASTEXITCODE -ne 0) { throw "Production dependency audit reported moderate or higher vulnerabilities" }
          npm audit --audit-level=moderate 2>&1 | Tee-Object -FilePath npm-audit.log
          if ($LASTEXITCODE -ne 0) { throw "npm audit reported moderate or higher dependency vulnerabilities" }

