            "data/schemas/vehicle-catalog-package.schema.json",
            "data/sql/local-core-v1.sql",
            "data/sql/local-core-v2.sql",
            "docs/LOCAL_VEHICLE_CATALOG_IMPORT.md",
            "lib/local-core-db.cjs",
            "scripts/verify-local-core.cjs",
