          $run = $successfulRuns | Select-Object -First 1
          if (-not $run) { throw "No successful RDW NL/EU research-pack run exists; a new snapshot must pass rights, schema and provenance checks before desktop integration." }
          $latestObservedRun = $response.workflow_runs | Sort-Object run_number -Descending | Select-Object -First 1
          if ($latestObservedRun -and $latestObservedRun.id -ne $run.id) {
            Write-Host "Latest observed RDW run #$($latestObservedRun.run_number) is $($latestObservedRun.status)/$($latestObservedRun.conclusion); using latest successful run #$($run.run_number) only. The integration step must match its source-manifest and snapshot hashes to the pinned repository manifest."
          }
          $artifactsUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/artifacts"
