name: Validate VAG-specific DTC source rights

on:
  push:
    branches:
      - main
      - "automation/**"
    paths:
      - "data/source-manifests/vag-factory-source-register.json"
      - "scripts/validate_vag_dtc_source_rights.py"
      - ".github/workflows/validate-vag-dtc-source-rights.yml"
  pull_request:
    paths:
      - "data/source-manifests/vag-factory-source-register.json"
      - "scripts/validate_vag_dtc_source_rights.py"
      - ".github/workflows/validate-vag-dtc-source-rights.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Fail-closed VAG DTC rights validation (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout pinned repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Validate VAG-specific DTC source rights
        run: python scripts/validate_vag_dtc_source_rights.py
