name: Validate Russian EAEU OTTS source rights

on:
  push:
    branches:
      - main
      - "automation/**"
    paths:
      - "data/source-manifests/russian-eaeu-otts-sources.json"
      - "scripts/validate_russian_eaeu_otts_sources.py"
      - ".github/workflows/validate-russian-eaeu-otts-sources.yml"
  pull_request:
    paths:
      - "data/source-manifests/russian-eaeu-otts-sources.json"
      - "scripts/validate_russian_eaeu_otts_sources.py"
      - ".github/workflows/validate-russian-eaeu-otts-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Fail-closed source-rights validation (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout pinned repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Record Python runtime version
        run: python -VV
      - name: Record EAEU form revision and field-map size
        run: python -c "import json; from pathlib import Path; d=json.loads(Path('data/source-manifests/russian-eaeu-otts-sources.json').read_text(encoding='utf-8')); f=d['eaeu_legal_framework']['otts_form_rules']; print(f['latest_reviewed_amendment'], f['amendment_effective_date'], len(f['field_map']))"
      - name: Validate Russian/EAEU OTTS source rights
        run: python scripts/validate_russian_eaeu_otts_sources.py
