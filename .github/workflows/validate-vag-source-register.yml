      - "docs/research/WAL33D_DTC_SOURCE_REVIEW_2026-11-04.md"
      - "tests/test_wal33d_source_rights.py"

permissions:
  contents: read

jobs:
  validate-data-source-rights:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate DTC and RU/EAEU source-rights boundaries
        run: python -m unittest discover -s tests -p "test_*source_rights.py" -v
