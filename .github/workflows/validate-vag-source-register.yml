permissions:
  contents: read

jobs:
  validate-data-source-rights:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate DTC and RU/EAEU source-rights boundaries
        run: python -m unittest discover -s tests -p "test_*source_rights.py" -v
      - name: Validate ELPTS public reference and tariff rights gate
        run: python tests/test_elpts_reference_rights_gate.py
      - name: Validate CC BY-SA Wikipedia engine-list quarantine
        run: python tests/test_wikipedia_vag_engine_list_rights_gate.py
