      - "tests/test_wal33d_source_rights.py"
      - "tests/test_openvag_source_rights.py"
      - "tests/test_mechanicdb_generic_guidance_source_rights.py"
      - "tests/test_wikidata_generation_source_rights.py"
      - "tests/test_vw_gis_diagnostics_data_source_rights.py"
      - "docs/research/VW_GIS_DIAGNOSTICS_DATA_RIGHTS_REVIEW_2026-11-06.md"
