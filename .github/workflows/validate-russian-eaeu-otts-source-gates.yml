name: Validate Russian EAEU and VAG OEM source contracts

on:
  push:
    branches:
      - main
      - "automation/**"
    paths:
      - data/source-manifests/russian-eaeu-otts-sources.json
      - docs/research/ELPTS_PUBLIC_REFERENCE_AND_TARIFF_RECHECK_2026-11-08.md
      - tests/test_elpts_reference_rights_gate.py
      - docs/research/KAZAKHSTAN_EOKNO_TRTS018_PUBLIC_REGISTER_REVIEW_2026-11-07.md
      - tests/test_kazakhstan_eokno_source_rights.py
      - tests/test_kazakhstan_techreg_source_rights.py
      - docs/research/ELPTS_OTTS_PUBLIC_REGISTRY_RIGHTS_REVIEW_2026-11-05.md
      - docs/research/FGIS_PUBLIC_SEARCH_ORDER_2038_REVIEW_2026-11-06.md
      - data/source-manifests/vw-okapi-product-catalog.json
      - docs/research/RU_EAEU_OTTS_RIGHTS_REVIEW_2026-11-03.md
      - docs/research/VW_OKAPI_SOURCE_REVIEW_2026-11-03.md
      - tests/test_russian_eaeu_otts_manifest.py
      - tests/test_russian_otts_provider_rights_manifest.py
      - tests/test_elpts_otts_source_rights.py
      - tests/test_vw_okapi_source_manifest.py
      - scripts/import_eaeu_otts_registry_export.py
      - tests/test_eaeu_otts_registry_import.py
      - tests/test_eaeu_otts_registry_manifest.py
      - docs/EAEU_OTTS_REGISTRY_IMPORT.md
      - package.json
      - scripts/import-authorized-fgis-otts-export.cjs
      - tests/authorized-fgis-otts-export.test.cjs
      - docs/OTTS_AUTHORIZED_EXPORT_IMPORT.md
      - .github/workflows/validate-russian-eaeu-otts-source-gates.yml
  pull_request:
    paths:
      - data/source-manifests/russian-eaeu-otts-sources.json
      - docs/research/ELPTS_PUBLIC_REFERENCE_AND_TARIFF_RECHECK_2026-11-08.md
      - tests/test_elpts_reference_rights_gate.py
      - docs/research/KAZAKHSTAN_EOKNO_TRTS018_PUBLIC_REGISTER_REVIEW_2026-11-07.md
      - tests/test_kazakhstan_eokno_source_rights.py
      - tests/test_kazakhstan_techreg_source_rights.py
      - docs/research/ELPTS_OTTS_PUBLIC_REGISTRY_RIGHTS_REVIEW_2026-11-05.md
      - docs/research/FGIS_PUBLIC_SEARCH_ORDER_2038_REVIEW_2026-11-06.md
      - data/source-manifests/vw-okapi-product-catalog.json
      - docs/research/RU_EAEU_OTTS_RIGHTS_REVIEW_2026-11-03.md
      - docs/research/VW_OKAPI_SOURCE_REVIEW_2026-11-03.md
      - tests/test_russian_eaeu_otts_manifest.py
      - tests/test_russian_otts_provider_rights_manifest.py
      - tests/test_elpts_otts_source_rights.py
      - tests/test_vw_okapi_source_manifest.py
      - scripts/import_eaeu_otts_registry_export.py
      - tests/test_eaeu_otts_registry_import.py
      - tests/test_eaeu_otts_registry_manifest.py
      - docs/EAEU_OTTS_REGISTRY_IMPORT.md
      - scripts/import-authorized-fgis-otts-export.cjs
      - tests/authorized-fgis-otts-export.test.cjs
      - docs/OTTS_AUTHORIZED_EXPORT_IMPORT.md
      - .github/workflows/validate-russian-eaeu-otts-source-gates.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vag-tech-pro-source-rights-contracts
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source rights, data scope and OTTS field namespaces
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate JSON manifests
        run: |
          python -m json.tool package.json > $null
          python -m json.tool data/source-manifests/russian-eaeu-otts-sources.json > $null
          python -m json.tool data/source-manifests/vw-okapi-product-catalog.json > $null
      - name: Run fail-closed source contract tests
        run: python -m unittest discover -s tests -p "test_*_manifest.py" -v
      - name: Compile and test schema-aware EAEU OTTS/OTSH XML importer
        run: |
          python -m py_compile scripts/import_eaeu_otts_registry_export.py
          python -m unittest discover -s tests -p "test_eaeu_otts_registry_import.py" -v
      - name: Validate Kazakhstan EOKNO and TechReg registry rights boundaries
        run: |
          python -m unittest discover -s tests -p "test_kazakhstan_eokno_source_rights.py" -v
          python -m unittest discover -s tests -p "test_kazakhstan_techreg_source_rights.py" -v
      - name: Validate ELPTS public OTTS, reference-file rights and EEC pilot-order boundary
        run: |
          python tests/test_elpts_reference_rights_gate.py
          python -m unittest discover -s tests -p "test_elpts_otts_source_rights.py" -v
      - name: Syntax-check the authorized FGIS importer
        run: node --check scripts/import-authorized-fgis-otts-export.cjs
      - name: Run transactional SQLite importer tests on Windows
        run: node --test tests/authorized-fgis-otts-export.test.cjs
