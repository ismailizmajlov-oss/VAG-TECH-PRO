name: Acquire VAG open engine candidates (research only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/acquire-vag-engine-candidates.yml'
      - 'scripts/import_vag_engine_candidates.py'
      - 'data/source-manifests/vag-factory-source-register.json'
      - 'docs/research/AUTOEVOLUTION_UPSTREAM_RIGHTS_REVIEW_2026-11-04.md'
      - 'tests/test_gor3a_source_rights.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Autoevolution-derived material is quarantined. This job must remain skipped until
  # the owner has written permission for commercial use, display, offline caching,
  # bulk reuse and redistribution, and has updated the source-rights register.
  acquire:
    if: ${{ vars.VAG_GOR3A_AUTODEVOLUTION_REUSE_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned ODbL VAG candidate files
        run: |
          set -euo pipefail
          mkdir -p .research-input artifacts
          REV="ee99776470a45214bf524cdfe22e5dbf4bd67f93"
          for brand in audi volkswagen skoda seat cupra; do
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/gor3a/vehicle-makes-models/${REV}/data/json/${brand}.json" \
              -o ".research-input/${brand}.json"
          done
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/gor3a/vehicle-makes-models/${REV}/LICENSE-DATA" \
            -o ".research-input/LICENSE-DATA"
          sha256sum .research-input/*.json .research-input/LICENSE-DATA
      - name: Import to isolated research SQLite
        run: |
          python scripts/import_vag_engine_candidates.py \
            --input-dir .research-input \
            --output artifacts/vag-engine-candidates-research.sqlite
      - name: Upload research-only database, manifest and license
        uses: actions/upload-artifact@v4
        with:
          name: vag-engine-candidates-research-odbl
          path: |
            artifacts/vag-engine-candidates-research.sqlite
            artifacts/vag-engine-candidates-research.manifest.json
            .research-input/LICENSE-DATA
          if-no-files-found: error
          retention-days: 30
