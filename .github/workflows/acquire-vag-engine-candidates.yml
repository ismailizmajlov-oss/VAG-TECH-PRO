name: Quarantine Autoevolution-derived VAG identity source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/acquire-vag-engine-candidates.yml
      - docs/research/AUTOEVOLUTION_UPSTREAM_RIGHTS_REVIEW_2026-11-04.md

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Record quarantine decision without downloading source data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quarantine
          cat > quarantine/autoevolution-vag-identity-quarantine.json <<'JSON'
          {
            "source_id": "gor3a-vehicle-makes-models-odbl",
            "downstream_license_declaration": "ODbL-1.0",
            "upstream_source": "autoevolution.com",
            "upstream_terms": "https://www.autoevolution.com/static/terms.html",
            "reviewed_at": "2026-11-04",
            "reviewed_sections": [4, 5, 8],
            "written_permission_obtained": false,
            "product_use_allowed": false,
            "actions": ["download", "import", "offline_cache", "display", "bundle", "redistribute"],
            "status": "quarantined_pending_written_upstream_permission"
          }
          JSON
      - name: Upload rights-gate report only
        uses: actions/upload-artifact@v4
        with:
          name: autoevolution-vag-identity-quarantine-report
          path: quarantine/autoevolution-vag-identity-quarantine.json
          if-no-files-found: error
          retention-days: 30
