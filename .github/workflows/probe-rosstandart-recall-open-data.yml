name: Probe Rosstandart recall open-data metadata

on:
  push:
    branches: [main]
    paths:
      - "scripts/probe_rosstandart_recall_open_data.py"
      - "tests/test_rosstandart_recall_probe.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosstandart-recall-metadata-probe
  cancel-in-progress: false

jobs:
  metadata-probe:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Test metadata parser and same-host link gate
        run: python -m unittest tests/test_rosstandart_recall_probe.py -v
      - name: Probe official landing and archive pages only
        run: python scripts/probe_rosstandart_recall_open_data.py --output artifacts/rosstandart-recall-open-data-probe.json
      - name: Upload metadata-only probe result
        uses: actions/upload-artifact@v4
        with:
          name: rosstandart-recall-open-data-probe
          path: artifacts/rosstandart-recall-open-data-probe.json
          if-no-files-found: error
          retention-days: 30
